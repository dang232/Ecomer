# Explicit local development overlay. This file is never auto-loaded.
# Use: docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile apps up -d
# Host debug ports are loopback-only; the JVM listeners bind the container interface.
# The password values below are local-only defaults. Never use this overlay for
# staging or production; shared environments must provide the required values
# consumed by docker-compose.yml through their secret manager.
services:
  postgres-keycloak:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vnshop}
  redis:
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru", "--requirepass", "${REDIS_PASSWORD:-vnshop123}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-vnshop123}", "ping"]
  order-service:
    environment:
      # Local gRPC mTLS assets are not checked into the repository. The HTTP
      # order surface remains available in this workstation-only overlay.
      GRPC_CLIENT_ENABLED: "false"
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "127.0.0.1:5005:5005"

  payment-service:
    environment:
      # Local gRPC mTLS assets are not checked into the repository. The HTTP
      # payment surface remains available in this workstation-only overlay.
      GRPC_SERVER_ENABLED: "false"
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006
    ports:
      - "127.0.0.1:5006:5006"

  product-service:
    environment:
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007
    ports:
      - "127.0.0.1:5007:5007"

  api-gateway:
    environment:
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5008
    ports:
