# Docker Compose Test Environment for Integration Testing
# Usage: docker-compose -f docker-compose.test.yml up

name: vnshop-test

services:
  postgres-test:
    image: postgres:17.9
    environment:
      POSTGRES_DB: vnshop_test
      POSTGRES_USER: vnshop
      POSTGRES_PASSWORD: vnshop123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnshop -d vnshop_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-test:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka-test:
    image: confluentinc/cp-kafka:8.2.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "bash", "-c", "'/usr/bin/kafka-broker-api-versions --bootstrap-server localhost:9092'"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Product Service for integration tests
  product-service-test:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/vnshop_test
      SPRING_DATASOURCE_USERNAME: vnshop
      SPRING_DATASOURCE_PASSWORD: vnshop123
      SPRING_DATA_REDIS_HOST: redis-test
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-test:9092
      SPRING_JPA_HIBERNATE_DDL_AUTO: update  # Auto-update schema for test env
      # Enable Redis cache for integration tests
      SPRING_CACHE_TYPE: redis
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      kafka-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Frontend for E2E tests
  frontend-test:
    build:
      context: ./fe
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "3000:8080"
    depends_on:
      - product-service-test
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  default:
    name: vnshop-test-network
