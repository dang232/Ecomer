  postgres-cart:
    # profiles removed for full deployment
    image: postgres:17.9
    container_name: vnshop-postgres-cart
    environment:
      POSTGRES_DB: vnshop_cart
      POSTGRES_USER: vnshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vnshop}
    ports:
      - "5442:5432"
    volumes:
      - postgres-cart-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnshop -d vnshop_cart"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: vnshop-timescaledb
    environment:
      POSTGRES_DB: monitoring
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: ${MONITORING_DB_PASSWORD:-monitoring}
    ports:
      - "5440:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./infra/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoring -d monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6-alpine
    container_name: vnshop-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru", "--requirepass", "${REDIS_PASSWORD:-vnshop123}"]
    # ports:
      # - "6379:6379"  # internal only
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-vnshop123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  mongo:
    image: mongo:7.0
    container_name: vnshop-mongo
    restart: unless-stopped
    # ports:
      # - "27017:27017"  # internal only
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-vnshop}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-vnshop123}
      MONGO_INITDB_DATABASE: notification_db
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------------
  # Kafka (local dev — single broker, replication.factor=1)
  #
  # Trade-off: a single broker means no partition replication and no
  # fault tolerance. This is intentional for local development: it keeps
  # resource usage low and avoids the ISR/leader-election delays that
  # slow down test cycles.
  #
  # Production uses a 3-broker StatefulSet with:
  #   default.replication.factor=3, min.insync.replicas=2
  # See infra/k8s/kafka/kafka-statefulset.yaml for the production setup.
  # -----------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:8.2.0
    container_name: vnshop-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: SASL_PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,SASL_PLAINTEXT_HOST://0.0.0.0:29092
      # Advertise the in-network address for service-to-broker traffic AND a host-mapped
      # address for tools running on the laptop. Without the in-network advertised name,
      # clients bootstrap fine but then get told to reconnect to "localhost:9092" and fail.
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka:9092,SASL_PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_PLAINTEXT_HOST:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf"
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: "User:admin;User:ANONYMOUS"
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:?KAFKA_ADMIN_PASSWORD must be set}
      KAFKA_ORDER_PASSWORD: ${KAFKA_ORDER_PASSWORD:?KAFKA_ORDER_PASSWORD must be set}
      KAFKA_PAYMENT_PASSWORD: ${KAFKA_PAYMENT_PASSWORD:?KAFKA_PAYMENT_PASSWORD must be set}
      KAFKA_INVENTORY_PASSWORD: ${KAFKA_INVENTORY_PASSWORD:?KAFKA_INVENTORY_PASSWORD must be set}
      KAFKA_PRODUCT_PASSWORD: ${KAFKA_PRODUCT_PASSWORD:?KAFKA_PRODUCT_PASSWORD must be set}
      KAFKA_SHIPPING_PASSWORD: ${KAFKA_SHIPPING_PASSWORD:?KAFKA_SHIPPING_PASSWORD must be set}
      KAFKA_FINANCE_PASSWORD: ${KAFKA_FINANCE_PASSWORD:?KAFKA_FINANCE_PASSWORD must be set}
      KAFKA_SEARCH_PASSWORD: ${KAFKA_SEARCH_PASSWORD:?KAFKA_SEARCH_PASSWORD must be set}
      KAFKA_RECOMMENDATIONS_PASSWORD: ${KAFKA_RECOMMENDATIONS_PASSWORD:?KAFKA_RECOMMENDATIONS_PASSWORD must be set}
      KAFKA_INVOICE_PASSWORD: ${KAFKA_INVOICE_PASSWORD:?KAFKA_INVOICE_PASSWORD must be set}
      KAFKA_MESSAGING_PASSWORD: ${KAFKA_MESSAGING_PASSWORD:?KAFKA_MESSAGING_PASSWORD must be set}
      KAFKA_USER_PASSWORD: ${KAFKA_USER_PASSWORD:?KAFKA_USER_PASSWORD must be set}
      KAFKA_VIDEO_TRANSCODER_PASSWORD: ${KAFKA_VIDEO_TRANSCODER_PASSWORD:?KAFKA_VIDEO_TRANSCODER_PASSWORD must be set}
      KAFKA_VIDEO_MODERATOR_PASSWORD: ${KAFKA_VIDEO_MODERATOR_PASSWORD:?KAFKA_VIDEO_MODERATOR_PASSWORD must be set}
      KAFKA_SSL_CLIENT_AUTH: none
    entrypoint: ["/bin/sh", "-c", "sed -e \"s/\\$${KAFKA_ADMIN_PASSWORD}/$KAFKA_ADMIN_PASSWORD/g\" -e \"s/\\$${KAFKA_ORDER_PASSWORD}/$KAFKA_ORDER_PASSWORD/g\" -e \"s/\\$${KAFKA_PAYMENT_PASSWORD}/$KAFKA_PAYMENT_PASSWORD/g\" -e \"s/\\$${KAFKA_INVENTORY_PASSWORD}/$KAFKA_INVENTORY_PASSWORD/g\" -e \"s/\\$${KAFKA_PRODUCT_PASSWORD}/$KAFKA_PRODUCT_PASSWORD/g\" -e \"s/\\$${KAFKA_SHIPPING_PASSWORD}/$KAFKA_SHIPPING_PASSWORD/g\" -e \"s/\\$${KAFKA_FINANCE_PASSWORD}/$KAFKA_FINANCE_PASSWORD/g\" -e \"s/\\$${KAFKA_SEARCH_PASSWORD}/$KAFKA_SEARCH_PASSWORD/g\" -e \"s/\\$${KAFKA_RECOMMENDATIONS_PASSWORD}/$KAFKA_RECOMMENDATIONS_PASSWORD/g\" -e \"s/\\$${KAFKA_INVOICE_PASSWORD}/$KAFKA_INVOICE_PASSWORD/g\" -e \"s/\\$${KAFKA_MESSAGING_PASSWORD}/$KAFKA_MESSAGING_PASSWORD/g\" -e \"s/\\$${KAFKA_USER_PASSWORD}/$KAFKA_USER_PASSWORD/g\" -e \"s/\\$${KAFKA_VIDEO_TRANSCODER_PASSWORD}/$KAFKA_VIDEO_TRANSCODER_PASSWORD/g\" -e \"s/\\$${KAFKA_VIDEO_MODERATOR_PASSWORD}/$KAFKA_VIDEO_MODERATOR_PASSWORD/g\" /etc/kafka/kafka_server_jaas.conf.template > /etc/kafka/kafka_server_jaas.conf && exec /etc/confluent/docker/run"]
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./infra/kafka/kafka_server_jaas.conf.template:/etc/kafka/kafka_server_jaas.conf.template:ro
    # TCP probe on the CONTROLLER port (PLAINTEXT, no auth required).
    # Verifies the broker process is up and accepting connections without
    # needing SASL credentials. replication.factor=1 (single broker — see
    # comment above the service definition for the production trade-off).
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9093' 2>/dev/null && echo OK"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536M

  init-kafka:
    image: confluentinc/cp-kafka:8.2.0
    container_name: vnshop-init-kafka
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:?KAFKA_ADMIN_PASSWORD must be set}
    volumes:
      - ./infra/scripts/init-kafka-topics.sh:/init-kafka-topics.sh:ro
    command: ["bash", "/init-kafka-topics.sh"]
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: vnshop-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/vnshop_keycloak
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: vnshop
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-vnshop}
      # Exposes /health/{started,live,ready} on management port 9000 (per Keycloak 26 docs).
      # The image has no curl/wget, so the healthcheck below uses bash's /dev/tcp.
      KC_HEALTH_ENABLED: "true"
      # Keep the issuer stable for local JWT validation. Keycloak itself is
      # network-internal; the browser uses the gateway's native auth boundary.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HOSTNAME_STRICT: "false"
      KEYCLOAK_GATEWAY_CLIENT_SECRET: ${KEYCLOAK_GATEWAY_CLIENT_SECRET:-vnshop-gateway-secret-dev}
      KEYCLOAK_ADMIN_API_CLIENT_SECRET: ${KEYCLOAK_ADMIN_API_CLIENT_SECRET:-vnshop-admin-api-secret-dev}
      # Social OAuth identity providers (Google, Facebook). Both clientId and clientSecret
      # must be set to enable. GOOGLE_OAUTH_ENABLED/FACEBOOK_OAUTH_ENABLED default to false.
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      FACEBOOK_OAUTH_ENABLED: ${FACEBOOK_OAUTH_ENABLED:-false}
      FACEBOOK_OAUTH_CLIENT_ID: ${FACEBOOK_OAUTH_CLIENT_ID:-}
      FACEBOOK_OAUTH_CLIENT_SECRET: ${FACEBOOK_OAUTH_CLIENT_SECRET:-}
    expose:
      - "8080"
    volumes:
      - ./infra/keycloak/vnshop-realm.json:/opt/keycloak/data/import/vnshop-realm.json:ro
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; head -1 <&3 | grep -q '200'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 768M

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.0
    container_name: vnshop-elasticsearch
    # profiles removed for full deployment
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set}
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    # ports:
      # - "9200:9200"  # internal only
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G

  # Local-dev object storage. Production swaps to Cloudflare R2 by setting
  # vnshop.object-storage.{profile,endpoint,access-key,secret-key,bucket} —
  # the AWS S3 SDK code in S3ObjectStorageAdapter / S3InvoiceStorageAdapter is
  # wire-compatible with both. R2 is the production target (zero egress fees).
  minio:
    # profiles removed for full deployment
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: vnshop-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vnshop}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vnshop123}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:3000,http://localhost:5173}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

  minio-bootstrap:
    # profiles removed for full deployment
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: vnshop-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-vnshop} ${MINIO_ROOT_PASSWORD:-vnshop123} &&
        mc mb --ignore-existing local/vnshop-products local/vnshop-reviews local/vnshop-invoices local/vnshop-avatars &&
        mc mb --ignore-existing local/vnshop-video-uploads-tmp local/vnshop-videos-staging local/vnshop-videos &&
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::vnshop-products/*"]}]}' > /tmp/vnshop-products-public.json &&
        mc anonymous set-json /tmp/vnshop-products-public.json local/vnshop-products &&
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::vnshop-reviews/*"]}]}' > /tmp/vnshop-reviews-public.json &&
        mc anonymous set-json /tmp/vnshop-reviews-public.json local/vnshop-reviews &&
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::vnshop-avatars/*"]}]}' > /tmp/vnshop-avatars-public.json &&
        mc anonymous set-json /tmp/vnshop-avatars-public.json local/vnshop-avatars &&
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::vnshop-videos/*"]}]}' > /tmp/vnshop-videos-public.json &&
        mc anonymous set-json /tmp/vnshop-videos-public.json local/vnshop-videos &&
        # Auto-expire raw uploads after 24 h
        mc ilm rule add --expire-days 1 local/vnshop-video-uploads-tmp &&
        echo "minio buckets ready"

  video-transcoder:
    # profiles removed for full deployment
    build:
      context: ./services/video-transcoder
      dockerfile: Dockerfile
    image: vnshop/video-transcoder:latest
    restart: unless-stopped
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '3.0'
          memory: 2048M
        reservations:
          cpus: '2.0'
          memory: 1024M
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SASL_USERNAME: ${KAFKA_VIDEO_USERNAME:-svc-video-transcoder}
      KAFKA_SASL_PASSWORD: ${KAFKA_VIDEO_TRANSCODER_PASSWORD:?KAFKA_VIDEO_TRANSCODER_PASSWORD must be set}
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:?KAFKA_SSL_TRUSTSTORE_PASSWORD must be set}
      S3_BUCKET_INPUT: vnshop-video-uploads-tmp
      S3_BUCKET_STAGING: vnshop-videos-staging
      SPRING_PROFILES_ACTIVE: docker
    tmpfs:
      - /tmp:size=512M
      - /tmp/transcode:size=4G,noexec
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy

  video-moderator:
    # profiles removed for full deployment
    build:
      context: ./services/video-moderator
    image: vnshop/video-moderator:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3072M
        reservations:
          memory: 2048M
    environment:
      MODERATOR_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MODERATOR_KAFKA_SASL_USERNAME: ${KAFKA_VIDEO_USERNAME:-svc-video-moderator}
      MODERATOR_KAFKA_SASL_PASSWORD: ${KAFKA_VIDEO_MODERATOR_PASSWORD:?KAFKA_VIDEO_MODERATOR_PASSWORD must be set}
      MODERATOR_KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      MODERATOR_STORAGE_ENDPOINT: http://minio:9000
      MODERATOR_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-vnshop}
      MODERATOR_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-vnshop123}
      MODERATOR_DATABASE_URL: postgresql://vnshop:${POSTGRES_PASSWORD:-vnshop}@postgres-product:5432/vnshop_product
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres-product:
        condition: service_healthy
    # Security hardening: matches the transcoder. The moderator talks to
    # Postgres (broader attack surface than MinIO-only), so defence-in-depth
    # matters. Model weights and frame extracts land in /tmp via tmpfs.
    tmpfs:
      - /tmp/video-moderator:size=2G,noexec,uid=65532,gid=65532,mode=1770
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL

  jaeger:
    image: jaegertracing/all-in-one:1.71.0
    container_name: vnshop-jaeger
    ports:
      - "16686:16686"
      - "14250:14250"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686"]
      interval: 15s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: vnshop-prometheus
    # ports:
      # TODO(prod): restrict port 9090 to an internal network or VPN — do not expose to the public internet in production
      # - "9090:9090"  # ponytail: expose only behind VPN in prod
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - ./infra/prometheus/slo-rules.yml:/etc/prometheus/slo-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.1.0
    container_name: vnshop-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-vnshop123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  loki:
    image: grafana/loki:3.1.0
    container_name: vnshop-loki
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  promtail:
    image: grafana/promtail:3.1.0
    container_name: vnshop-promtail
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:latest
    container_name: vnshop-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./infra/alertmanager/rules.yml:/etc/alertmanager/rules.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10

  api-gateway:
    # profiles removed for full deployment
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: vnshop-api-gateway
    restart: on-failure:5
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
        restart: true
      keycloak:
        condition: service_healthy
        restart: true
    environment:
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-vnshop123}
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/vnshop
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/vnshop/protocol/openid-connect/certs
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    # profiles removed for full deployment
    build:
      context: ./fe
      args:
        # Vite inlines these at build time. Override per environment.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        # Payment provider toggles + publishable creds. Vite inlines at build,
        # so adding/removing requires `up -d --build frontend`. Defaults are
        # `false`/empty so the success step renders the disabled-placeholder
        # rather than the live Stripe/PayPal section when creds aren't set.
        VITE_STRIPE_ENABLED: ${VITE_STRIPE_ENABLED:-false}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
        VITE_PAYPAL_ENABLED: ${VITE_PAYPAL_ENABLED:-false}
        VITE_PAYPAL_CLIENT_ID: ${VITE_PAYPAL_CLIENT_ID:-}
        VITE_ALLOW_INSECURE_RUNTIME_CONFIG: ${VITE_ALLOW_INSECURE_RUNTIME_CONFIG:-true}
    container_name: vnshop-frontend
    ports:
      - "3000:8080"
    depends_on:
      api-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  user-service:
    # profiles removed for full deployment
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: vnshop-user-service
    # ports:
      # - "8081:8081"  # ponytail: internal only, access via gateway
    depends_on:
      postgres-user:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/vnshop_user?currentSchema=user_svc
      SPRING_DATASOURCE_USERNAME: vnshop
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-vnshop}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-vnshop123}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_SASL_USERNAME: svc-user
      KAFKA_SASL_PASSWORD: ${KAFKA_USER_PASSWORD:?KAFKA_USER_PASSWORD must be set}
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/vnshop
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/vnshop/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_API_CLIENT_SECRET:-vnshop-admin-api-secret-dev}
      KEYCLOAK_PUBLIC_BASE_URL: ${KEYCLOAK_PUBLIC_BASE_URL:-http://localhost:8080}
      VNSHOP_INTERNAL_ALLOWED_CLIENT_ID: ${VNSHOP_INTERNAL_ALLOWED_CLIENT_ID:?VNSHOP_INTERNAL_ALLOWED_CLIENT_ID must be set}
      UNLEASH_API_URL: http://unleash:4242/api
      UNLEASH_CLIENT_API_TOKEN: ${UNLEASH_CLIENT_API_TOKEN:?UNLEASH_CLIENT_API_TOKEN must be set}
      UNLEASH_APP_NAME: user-service
      VNSHOP_PAYOUT_DESTINATION_KEY_V1: ${VNSHOP_PAYOUT_DESTINATION_KEY_V1:?VNSHOP_PAYOUT_DESTINATION_KEY_V1 must be set}
      VNSHOP_PAYOUT_DESTINATION_DEFAULT_KEY_VERSION: ${VNSHOP_PAYOUT_DESTINATION_DEFAULT_KEY_VERSION:?VNSHOP_PAYOUT_DESTINATION_DEFAULT_KEY_VERSION must be set}
      ADMIN_CURSOR_SECRET: ${ADMIN_CURSOR_SECRET:?ADMIN_CURSOR_SECRET must be set}
      VNSHOP_AUTH_CALLBACK_BASE_URL: ${VNSHOP_AUTH_CALLBACK_BASE_URL:-http://localhost:8080/auth/oauth/callback}
      VNSHOP_FRONTEND_URL: ${VNSHOP_FRONTEND_URL:-http://localhost:3000}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      # Avatar object storage. Reads from .env — defaults to MinIO for local dev.
      # Flip PROFILE=R2 + R2 endpoint/keys in .env when R2 creds are available.
      VNSHOP_USER_STORAGE_ENABLED: ${VNSHOP_USER_STORAGE_ENABLED:-true}
      VNSHOP_USER_STORAGE_PROFILE: ${VNSHOP_USER_STORAGE_PROFILE:-MINIO}
      VNSHOP_USER_STORAGE_ENDPOINT: ${VNSHOP_USER_STORAGE_ENDPOINT:-http://minio:9000}
      VNSHOP_USER_STORAGE_PUBLIC_ENDPOINT: ${VNSHOP_USER_STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      VNSHOP_USER_STORAGE_BUCKET: ${VNSHOP_USER_STORAGE_BUCKET:-vnshop-avatars}
      VNSHOP_USER_STORAGE_REGION: ${VNSHOP_USER_STORAGE_REGION:-auto}
      VNSHOP_USER_STORAGE_ACCESS_KEY: ${VNSHOP_USER_STORAGE_ACCESS_KEY:-${MINIO_ROOT_USER:-vnshop}}
      VNSHOP_USER_STORAGE_SECRET_KEY: ${VNSHOP_USER_STORAGE_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-vnshop123}}
      VNSHOP_USER_STORAGE_PATH_STYLE_ACCESS: ${VNSHOP_USER_STORAGE_PATH_STYLE_ACCESS:-true}
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  product-service:
    # profiles removed for full deployment
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    container_name: vnshop-product-service
    # ports:
      # - "8082:8082"
    depends_on:
      postgres-product:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      configuration-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-product:5432/vnshop_product?currentSchema=product_svc
      SPRING_DATASOURCE_USERNAME: vnshop
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-vnshop}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-vnshop123}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_SASL_USERNAME: svc-product
      KAFKA_SASL_PASSWORD: ${KAFKA_SVC_PRODUCT_PASSWORD:-kafka-product}
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:?KAFKA_SSL_TRUSTSTORE_PASSWORD must be set}
      VNSHOP_PRODUCT_CURSOR_SECRET: ${VNSHOP_PRODUCT_CURSOR_SECRET:?VNSHOP_PRODUCT_CURSOR_SECRET must be set}
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/vnshop
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/vnshop/protocol/openid-connect/certs
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      # Object storage — defaults route to local MinIO. Override OBJECT_STORAGE_*
      # in .env to point at Cloudflare R2 (or any S3-compatible backend) for prod.
      VNSHOP_OBJECT_STORAGE_ENABLED: ${OBJECT_STORAGE_ENABLED:-true}
      VNSHOP_OBJECT_STORAGE_PROFILE: ${OBJECT_STORAGE_PROFILE:-MINIO}
      VNSHOP_OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET_PRODUCTS:-vnshop-products}
      VNSHOP_OBJECT_STORAGE_REVIEW_BUCKET: ${OBJECT_STORAGE_BUCKET_REVIEWS:-vnshop-reviews}
      S3_BUCKET_VIDEO_INPUT: ${S3_BUCKET_VIDEO_INPUT:-vnshop-video-uploads-tmp}
      S3_BUCKET_VIDEO_STAGING: ${S3_BUCKET_VIDEO_STAGING:-vnshop-videos-staging}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-vnshop-videos}
      VNSHOP_OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      VNSHOP_OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      VNSHOP_OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-auto}
      VNSHOP_OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-vnshop}
      VNSHOP_OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-vnshop123}
      VNSHOP_OBJECT_STORAGE_PATH_STYLE_ACCESS: ${OBJECT_STORAGE_PATH_STYLE:-true}
      # Local staging dir for resumable video uploads (C1 fix — chunks buffer here
      # until finalise, then PUT to S3 in a single object).
      VIDEO_UPLOAD_LOCAL_STAGING_DIR: /tmp/video-uploads
    volumes:
      - ./infra/kafka/certs/kafka.truststore.jks:/etc/kafka/secrets/kafka.truststore.jks:ro
    tmpfs:
      # 6 GB tmpfs holds 1 × 500 MB upload in progress + ~5 GB headroom for concurrent sessions
      # The image runs as vnshop:vnshop (UID/GID 1000). Set ownership on the
      # tmpfs mount itself because the mount hides any image-layer directory.
      - /tmp/video-uploads:size=6G,uid=1000,gid=1000,mode=700,noexec
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  inventory-service:
    # profiles removed for full deployment
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: vnshop-inventory-service
    # ports:
      # - "8083:8083"
    depends_on:
      postgres-inventory:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      configuration-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-inventory:5432/vnshop_inventory?currentSchema=inventory_svc
      SPRING_DATASOURCE_USERNAME: vnshop
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-vnshop}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-vnshop123}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_SASL_USERNAME: svc-inventory
      KAFKA_SASL_PASSWORD: ${KAFKA_SVC_INVENTORY_PASSWORD:-kafka-inventory}
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:?KAFKA_SSL_TRUSTSTORE_PASSWORD must be set}
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/vnshop
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/vnshop/protocol/openid-connect/certs
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
    volumes:
      - ./infra/kafka/certs/kafka.truststore.jks:/etc/kafka/secrets/kafka.truststore.jks:ro
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  cart-service:
    # profiles removed for full deployment
    build: ./services/cart-service
    container_name: vnshop-cart-service
    ports:
      - "8084:8084"
    depends_on:
      redis:
        condition: service_healthy
      postgres-cart:
        condition: service_healthy
    environment:
      SERVER_PORT: 8084
      OPENAPI_ENABLED: ${SWAGGER_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-vnshop123}
      DATABASE_URL: postgresql://vnshop:${POSTGRES_PASSWORD:-vnshop}@postgres-cart:5432/vnshop_cart
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/vnshop
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/vnshop/protocol/openid-connect/certs
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      # Without this, ProductHttpClientAdapter falls through to its
      # offline-mode branch and every cart item shows the raw UUID as the
      # product name with 0₫. See product-http-client.adapter.ts.
      PRODUCT_SERVICE_URL: http://product-service:8082
      USER_SERVICE_URL: http://user-service:8081
      USER_SERVICE_TIMEOUT_MS: ${USER_SERVICE_TIMEOUT_MS:-2000}
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8084/health || curl -fs http://localhost:8084 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  configuration-service:
    # profiles removed for full deployment
    build: ./services/configuration-service
    container_name: vnshop-configuration-service
    environment:
      SERVER_PORT: 8097
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      API_ORIGIN: ${API_ORIGIN:-http://localhost:8080}
      AUTH_ORIGIN: ${AUTH_ORIGIN:-http://localhost:8080}
      RUNTIME_CONFIG_ALLOW_INSECURE: ${RUNTIME_CONFIG_ALLOW_INSECURE:-true}
      OPENAPI_ENABLED: ${SWAGGER_ENABLED:-true}
      BRAND_NAME: VNShop
      BRAND_TAGLINE: MARKETPLACE
      SOCIAL_FACEBOOK: https://facebook.com/vnshop
      SOCIAL_INSTAGRAM: https://instagram.com/vnshop
      SOCIAL_TWITTER: https://x.com/vnshop
      SOCIAL_YOUTUBE: https://youtube.com/vnshop
      PAYMENT_PROVIDERS: VNPay,MoMo,COD,Visa,Mastercard
      PAYMENT_DEFAULT: COD
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      FACEBOOK_OAUTH_ENABLED: ${FACEBOOK_OAUTH_ENABLED:-false}
      SUPPORT_PHONE: "1900-0000"
      SUPPORT_EMAIL: support@vnshop.vn
      CONFIG_FILE_PATH: /app/config/services.yml
      CONFIG_SERVICE_INTERNAL_TOKEN: ${CONFIG_SERVICE_INTERNAL_TOKEN:?CONFIG_SERVICE_INTERNAL_TOKEN must be set}
    volumes:
      - ./services/configuration-service/config:/app/config:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8097/api/config"]
      interval: 10s
      timeout: 5s
      retries: 3

  search-service:
    # profiles removed for full deployment
    build:
      context: ./services/search-service
      dockerfile: Dockerfile
    container_name: vnshop-search-service
    # ports:
      # - "8086:8086"
    depends_on:
      postgres-search:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      configuration-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8086
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-search:5432/vnshop_search?currentSchema=search_svc
      SPRING_DATASOURCE_USERNAME: vnshop
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-vnshop}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-vnshop123}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
