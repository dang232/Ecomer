      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/vnshop/protocol/openid-connect/certs
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8096 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-unleash:
    image: postgres:16-alpine
    container_name: vnshop-postgres-unleash
    environment:
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: ${UNLEASH_DB_PASSWORD:-unleash123}
      POSTGRES_DB: unleash
    volumes:
      - unleash-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash"]
      interval: 5s
      timeout: 3s
      retries: 10

  unleash:
    image: unleashorg/unleash-server:6.1
    container_name: vnshop-unleash
    ports:
      - "4242:4242"
    environment:
      DATABASE_URL: postgres://unleash:${UNLEASH_DB_PASSWORD:-unleash123}@postgres-unleash:5432/unleash
      DATABASE_SSL: "false"
      INIT_ADMIN_API_TOKENS: ${UNLEASH_ADMIN_API_TOKEN:?UNLEASH_ADMIN_API_TOKEN must be set}
      INIT_CLIENT_API_TOKENS: ${UNLEASH_CLIENT_API_TOKEN:?UNLEASH_CLIENT_API_TOKEN must be set}
    depends_on:
      postgres-unleash:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4242/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  postgres-invoice:
    # profiles removed for full deployment
    image: postgres:17.9
    container_name: vnshop-postgres-invoice
    environment:
      POSTGRES_DB: vnshop_invoice
      POSTGRES_USER: vnshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vnshop}
    ports:
      - "5441:5432"
    volumes:
      - postgres-invoice-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnshop -d vnshop_invoice"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  invoice-service:
    # profiles removed for full deployment
    build:
      context: ./services/invoice-service
      dockerfile: Dockerfile
    container_name: vnshop-invoice-service
    ports:
      - "8098:8098"
    depends_on:
      postgres-invoice:
        condition: service_healthy
      kafka:
        condition: service_healthy
      configuration-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8098
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-invoice:5432/vnshop_invoice?currentSchema=invoice_svc
      SPRING_DATASOURCE_USERNAME: vnshop
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-vnshop}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_SASL_USERNAME: svc-invoice
      KAFKA_SASL_PASSWORD: ${KAFKA_SVC_INVOICE_PASSWORD:-kafka-invoice}
      INVOICE_SYMBOL: ${INVOICE_SYMBOL:?INVOICE_SYMBOL must be set}
      INVOICE_SELLER_NAME: ${INVOICE_SELLER_NAME:?INVOICE_SELLER_NAME must be set}
      INVOICE_SELLER_TAX_CODE: ${INVOICE_SELLER_TAX_CODE:?INVOICE_SELLER_TAX_CODE must be set}
      INVOICE_SELLER_ADDRESS: ${INVOICE_SELLER_ADDRESS:?INVOICE_SELLER_ADDRESS must be set}
      INVOICE_SELLER_PHONE: ${INVOICE_SELLER_PHONE:-}
      INVOICE_SELLER_EMAIL: ${INVOICE_SELLER_EMAIL:?INVOICE_SELLER_EMAIL must be set}
      CONFIG_SERVICE_INTERNAL_TOKEN: ${CONFIG_SERVICE_INTERNAL_TOKEN:?CONFIG_SERVICE_INTERNAL_TOKEN must be set}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres-legacy-data:
  postgres-keycloak-data:
  postgres-user-data:
  postgres-product-data:
  postgres-order-data:
  postgres-payment-data:
  postgres-inventory-data:
  postgres-search-data:
  postgres-shipping-data:
  postgres-cart-data:
  redis-data:
  kafka-data:
  elasticsearch-data:
  minio-data:
  mongo-data:
  timescaledb-data:
  prometheus-data:
  grafana-data:
  loki-data:
  unleash-db-data:
  postgres-invoice-data:
