name: vnshop

# Dev-only secrets warning
# -----------------------------------------------------------------
# The `:-vnshop123` fallbacks on MINIO_ROOT_PASSWORD, KAFKA_SVC_*_PASSWORD,
# KAFKA_VIDEO_*_PASSWORD, and POSTGRES_PASSWORD are LOCAL DEV DEFAULTS.
# They must be overridden via .env in any non-local environment. The
# `${VAR:?must be set}` syntax on KAFKA_VIDEO_TRANSCODER_PASSWORD /
# KAFKA_VIDEO_MODERATOR_PASSWORD forces an explicit value (no default) for
# the most-privileged video pipeline credentials. Search for "vnshop123"
# in the env files of your staging/prod environments to confirm.
# -----------------------------------------------------------------

services:
  postgres-legacy:
    # profiles removed for full deployment
    image: postgres:17.9
    container_name: vnshop-postgres-legacy
    environment:
      POSTGRES_DB: vnshop
      POSTGRES_USER: ${POSTGRES_USER:-vnshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vnshop}
    ports:
      - "5432:5432"
    volumes:
      - postgres-legacy-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnshop -d vnshop"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  postgres-keycloak:
    image: postgres:17.9
    container_name: vnshop-postgres-keycloak
    environment:
      POSTGRES_DB: vnshop_keycloak
      POSTGRES_USER: ${POSTGRES_USER:-vnshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vnshop}
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnshop -d vnshop_keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  postgres-user:
    # profiles removed for full deployment
    image: postgres:17.9
    container_name: vnshop-postgres-user
