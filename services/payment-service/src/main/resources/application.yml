server:
  port: 8092

spring:
  threads:
    virtual:
      enabled: true
  config:
    import: classpath:application-grpc.yml
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5436/vnshop_payment?currentSchema=payment_svc
    username: vnshop
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: payment-svc-pool
  flyway:
    enabled: true
    schemas: payment_svc
    default-schema: payment_svc
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_USERNAME}" password="${KAFKA_SASL_PASSWORD}";
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
      ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
      ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
      ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
      ssl.endpoint.identification.algorithm: https
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # JsonSerializer (Spring) is what every other producer in the platform
      # uses; matches the format order-service / seller-finance-service expect
      # on consume. add.type.headers=false matches order-service so consumers
      # bind to a value class without needing a __TypeId__ header.
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        spring.json.add.type.headers: false
    consumer:
      # PayPalRefundListener consumes payment.refund_requested as raw JSON and
      # parses with ObjectMapper, matching the order-service @KafkaListener
      # pattern. Explicit StringDeserializer here so a future producer that
      # forgets add.type.headers=false doesn't trip a class-not-found
      # deserialization error inside the consumer thread.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/vnshop}

          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/vnshop/protocol/openid-connect/certs}

payment:
  # Per-method enable flags. Set the env var to "true" to turn the method on.
  # COD defaults on. Every provider with buyer-visible destination or browser
  # configuration defaults off until its complete configuration is supplied.
  cod:
    enabled: ${COD_ENABLED:true}
  vietqr:
    enabled: ${VIETQR_ENABLED:false}
  paypal:
    enabled: ${PAYPAL_ENABLED:false}
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    mode: ${PAYPAL_MODE:sandbox}
  sepay:
    enabled: ${SEPAY_ENABLED:false}
    api-key: ${SEPAY_API_KEY:}
    account-id: ${SEPAY_ACCOUNT_ID:}
    base-url: ${SEPAY_BASE_URL:https://my.sepay.vn/userapi}
    poll-interval-seconds: ${SEPAY_POLL_INTERVAL_SECONDS:30}
    # Shared secret for SePay push-mode webhooks. SePay sends this in the
    # "Authorization: Apikey <secret>" header on each callback. Leave blank
    # to disable signature checking (dev/sandbox only — never in production).
    webhook-secret: ${SEPAY_WEBHOOK_SECRET:}
  stripe:
    enabled: ${STRIPE_ENABLED:false}
    secret-key: ${STRIPE_SECRET_KEY:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  vnpay:
    enabled: ${VNPAY_ENABLED:false}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    return-url: ${VNPAY_RETURN_URL:${VNSHOP_FRONTEND_URL:http://localhost:3000}/payment/return/vnpay}
    ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/payment/vnpay/ipn}
    version: ${VNPAY_VERSION:2.1.0}
    command: ${VNPAY_COMMAND:pay}
    order-type: ${VNPAY_ORDER_TYPE:other}
    locale: ${VNPAY_LOCALE:vn}
    currency: ${VNPAY_CURRENCY:VND}
    expire-minutes: ${VNPAY_EXPIRE_MINUTES:15}
  momo:
    enabled: ${MOMO_ENABLED:false}
    create-endpoint: ${MOMO_CREATE_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
    query-dr-endpoint: ${MOMO_QUERY_DR_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/query}
    partner-code: ${MOMO_PARTNER_CODE:}
    access-key: ${MOMO_ACCESS_KEY:}
    secret-key: ${MOMO_SECRET_KEY:}
    redirect-url: ${MOMO_REDIRECT_URL:${VNSHOP_FRONTEND_URL:http://localhost:3000}/payment/return/momo}
    ipn-url: ${MOMO_IPN_URL:http://localhost:8080/payment/momo/ipn}
    request-type: ${MOMO_REQUEST_TYPE:captureWallet}
    lang: ${MOMO_LANG:vi}
  fx:
    # FrankfurterFxAdapter — frankfurter.app is free, ECB-sourced, no API key.
    # 24h TTL because intraday FX swings are too small for sandbox to care.
    # fallback-usd-to-vnd is applied (with a WARN log per hit) on adapter
    # failure so a Stripe order doesn't 500 because frankfurter.app blipped.
    base-url: ${FX_BASE_URL:https://api.frankfurter.app}
    cache-ttl: ${FX_CACHE_TTL:PT24H}
    cache-max-entries: ${FX_CACHE_MAX_ENTRIES:100}
    fallback-usd-to-vnd: ${FX_FALLBACK_RATE:25500}

# VietQR config — buyer scans the QR, transfers from their bank app, admin
# manually confirms via POST /admin/vietqr/confirm/{paymentId}. No webhook,
# no public domain. The bank-bin default is 970436 (Vietcombank); change for
# other VN banks: TCB 970407, MBB 970422, etc. (vietqr.io/v2/banks lists all).
vietqr:
  bank-bin: ${VIETQR_BANK_BIN:970436}
  account-no: ${VIETQR_ACCOUNT_NO:}
  account-name: ${VIETQR_ACCOUNT_NAME:}
  template: ${VIETQR_TEMPLATE:compact2}

# VietQR payment timeout sweep. Payments that remain PENDING beyond
# timeout-minutes are transitioned to PAYMENT_TIMEOUT by VietQrTimeoutJob.
# timeout-check-interval-seconds controls how frequently the sweep runs.
payment.vietqr.timeout-minutes: ${VIETQR_TIMEOUT_MINUTES:10}
payment.vietqr.timeout-check-interval-seconds: ${VIETQR_TIMEOUT_CHECK_INTERVAL_SECONDS:60}

vnshop:
  public-api-url: ${VNSHOP_PUBLIC_API_URL:}
  frontend-url: ${VNSHOP_FRONTEND_URL:http://localhost:3000}

config-service:
  url: ${CONFIG_SERVICE_URL:http://configuration-service:8097}
  enabled: ${CONFIG_SERVICE_ENABLED:true}
  timeout-ms: 3000
  token: ${CONFIG_SERVICE_INTERNAL_TOKEN:}

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,circuitbreakers
      discovery:
        enabled: false
  endpoint:
    env:
      enabled: false
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

otel:
  traces:
    exporter: jaeger
  exporter:
    jaeger:
      endpoint: http://localhost:14250

# Resilience4j Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      paymentGateway:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallDurationThreshold: 5s
        slowCallRateThreshold: 80
---
spring:
  config:
    activate:
      on-profile: dev

# otel.sdk.trace.sampler.probability removed — use OTEL_TRACES_SAMPLER_ARG env var instead
