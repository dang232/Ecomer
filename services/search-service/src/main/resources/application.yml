server:
  port: 8086

spring:
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAdminAutoConfiguration
  threads:
    virtual:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 50
  application:
    name: search-service
  datasource:
    url: jdbc:postgresql://localhost:5438/vnshop_search?currentSchema=search_svc
    username: vnshop
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: search-svc-pool
  flyway:
    enabled: true
    schemas: search_svc
    default-schema: search_svc
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_USERNAME}" password="${KAFKA_SASL_PASSWORD}";
      ssl.endpoint.identification.algorithm: https
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
      ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
      ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
      ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
    admin:
      properties:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
        sasl.mechanism: PLAIN
        sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_USERNAME}" password="${KAFKA_SASL_PASSWORD}";
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD}
        ssl.client.auth: required
        ssl.endpoint.identification.algorithm: https
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
  elasticsearch:
    uris: ${ELASTICSEARCH_URL:https://elasticsearch:9200}
    username: ${ELASTICSEARCH_USERNAME:search-service}
    password: ${ELASTICSEARCH_PASSWORD}
    restclient:
      ssl:
        bundle: ${ELASTICSEARCH_SSL_BUNDLE:elasticsearch}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/vnshop}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/vnshop/protocol/openid-connect/certs}
          audiences: ${KEYCLOAK_JWT_AUDIENCE:vnshop-api}

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}

management:
  health:
    kafka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
      discovery:
        enabled: false
  endpoint:
    env:
      enabled: false
    health:
      probes:
        enabled: true
      show-details: when_authorized
      validate-group-membership: false
      group:
        readiness:
          include: readinessState,db,elasticsearch
        liveness:
          include: livenessState
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

otel:
  traces:
    exporter: jaeger

search:
  cursor:
    secret: ${VNSHOP_SEARCH_CURSOR_SECRET:local-search-cursor-secret}
  facets:
    max-buckets: ${SEARCH_FACETS_MAX_BUCKETS:100}

---
spring:
  config:
    activate:
      on-profile: "!local"
  ssl:
    bundle:
      pem:
        elasticsearch:
          truststore:
            certificate: ${ELASTICSEARCH_CA_CERTIFICATE:/etc/elasticsearch/tls/ca.crt}
  exporter:
    jaeger:
      endpoint: http://localhost:14250
kafka:
  health:
    consumer:
      enabled: false
      lag-threshold: 1000
      group-id: search-service

logging:
  level:
    org.apache.kafka.clients.admin: OFF
    org.apache.kafka.clients.NetworkClient: WARN

---
spring:
  config:
    activate:
      on-profile: dev

# otel.sdk.trace.sampler.probability removed — use OTEL_TRACES_SAMPLER_ARG env var instead
