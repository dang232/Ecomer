server:
  port: 8098

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: video-transcoder
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_USERNAME}" password="${KAFKA_SASL_PASSWORD}";
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:/etc/kafka/secrets/kafka.truststore.jks}
      ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD}
      ssl.endpoint.identification.algorithm: https
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    listener:
      observation-enabled: true
    template:
      observation-enabled: true

vnshop:
  s3:
    endpoint: ${S3_ENDPOINT:http://minio:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}

transcoder:
  tmpfs-dir: ${TRANSCODER_TMPFS_DIR:/tmp/transcoder}
  input-bucket: ${S3_BUCKET_INPUT}
  staging-bucket: ${S3_BUCKET_STAGING}
  process-timeout-seconds: ${TRANSCODER_PROCESS_TIMEOUT_SECONDS:360}
  input-duration-limit-seconds: ${TRANSCODER_INPUT_DURATION_LIMIT_SECONDS:600}
  output-size-limit-bytes: ${TRANSCODER_OUTPUT_SIZE_LIMIT_BYTES:2147483648}
  ffmpeg-threads: ${TRANSCODER_FFMPEG_THREADS:3}
  probe-timeout-seconds: ${TRANSCODER_PROBE_TIMEOUT_SECONDS:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include: readinessState
        liveness:
          include: livenessState
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
---
spring:
  config:
    activate:
      on-profile: dev
  kafka:
    properties:
      security.protocol: PLAINTEXT
      sasl.jaas.config: ""
