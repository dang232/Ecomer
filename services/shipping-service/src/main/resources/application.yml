server:
  port: 8093

spring:
  threads:
    virtual:
      enabled: true
  config:
    import: classpath:application-grpc.yml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/vnshop}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/vnshop/protocol/openid-connect/certs}
  application:
    name: shipping-service
  datasource:
    url: jdbc:postgresql://localhost:5439/vnshop_shipping?currentSchema=shipping_svc
    username: vnshop
    password: ${DB_PASSWORD:vnshop}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: shipping-svc-pool
  flyway:
    enabled: true
    schemas: shipping_svc
    default-schema: shipping_svc
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_USERNAME:svc-shipping}" password="${KAFKA_SASL_PASSWORD:shipping-secret-change-me}";
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:/etc/kafka/secrets/kafka.truststore.jks}
      ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:kafka-ssl-dev-password}
      ssl.endpoint.identification.algorithm: https
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      observation-enabled: true
    template:
      observation-enabled: true

shipping:
  carrier:
    mode: ${CARRIER_MODE:stub}
    ghn:
      base-url: ${GHN_BASE_URL:https://dev-online-gateway.ghn.vn}
      token: ${GHN_TOKEN:}
      shop-id: ${GHN_SHOP_ID:}
      service-type-id: ${GHN_SERVICE_TYPE_ID:2}
    ghtk:
      base-url: ${GHTK_BASE_URL:https://services.giaohangtietkiem.vn}
      token: ${GHTK_TOKEN:}
      partner-code: ${GHTK_PARTNER_CODE:}

config-service:
  url: ${CONFIG_SERVICE_URL:http://configuration-service:8097}
  enabled: ${CONFIG_SERVICE_ENABLED:true}
  timeout-ms: 3000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    env:
      enabled: false
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

otel:
  traces:
    exporter: jaeger
  exporter:
    jaeger:
      endpoint: http://localhost:14250
---
spring:
  config:
    activate:
      on-profile: dev

# otel.sdk.trace.sampler.probability removed — use OTEL_TRACES_SAMPLER_ARG env var instead
