server:
  port: 8094

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}

spring:
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAdminAutoConfiguration
  threads:
    virtual:
      enabled: true
  application:
    name: recommendations-service
  datasource:
    url: jdbc:postgresql://localhost:5432/vnshop?currentSchema=recommendations_svc
    username: vnshop
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: recommendations-svc-pool
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    schemas: recommendations_svc
    default-schema: recommendations_svc
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_USERNAME}" password="${KAFKA_SASL_PASSWORD}";
      ssl.endpoint.identification.algorithm: https
    admin:
      properties:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
        sasl.mechanism: PLAIN
        sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_USERNAME}" password="${KAFKA_SASL_PASSWORD}";
    consumer:
      group-id: recommendations-service
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      observation-enabled: true
    template:
      observation-enabled: true

vnshop:
  recommendations:
    # Base URL the service uses for cross-service product lookups (BE→BE).
    # Inside docker-compose this resolves to product-service:8082; locally to localhost:8082.
    product-service-url: ${PRODUCT_SERVICE_URL:http://product-service:8082}
    # ±N% price band for the "you may also like" same-category filter.
    price-proximity-percent: 30
    # Max categories worth of candidates to consider before ranking.
    you-may-also-like-candidate-pool: 100

kafka:
  health:
    consumer:
      enabled: false
      lag-threshold: 1000
      group-id: recommendations-service

logging:
  level:
    org.apache.kafka.clients.admin: OFF
    org.apache.kafka.clients.NetworkClient: WARN

management:
  health:
    kafka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
      discovery:
        enabled: false
  endpoint:
    env:
      enabled: false
    health:
      probes:
        enabled: true
      show-details: when_authorized
      validate-group-membership: false
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
