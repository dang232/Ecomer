server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          # `iss` claim validation uses the gateway URL (matches what KC_HOSTNAME=http://localhost:8080
          # makes the running Keycloak put in tokens). Backchannel JWKS fetch goes through the in-network
          # URL via jwk-set-uri so the gateway doesn't depend on resolving "localhost" from inside Docker.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/vnshop}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/vnshop/protocol/openid-connect/certs}
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            # Comma-separated list. Default covers the local SPA dev/preview ports.
            # In production set GATEWAY_CORS_ALLOWED_ORIGINS to the canonical origin(s).
            allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
            allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowed-headers: "*"
            exposed-headers: X-Correlation-Id
            allow-credentials: false
            max-age: 3600

vnshop:
  gateway:
    public-buckets:
      avatar: ${VNSHOP_GATEWAY_PUBLIC_BUCKET_AVATAR:vnshop-avatars}
      product: ${VNSHOP_GATEWAY_PUBLIC_BUCKET_PRODUCT:vnshop-products}
      review: ${VNSHOP_GATEWAY_PUBLIC_BUCKET_REVIEW:vnshop-reviews}
      video: ${VNSHOP_GATEWAY_PUBLIC_BUCKET_VIDEO:vnshop-videos}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
      discovery:
        enabled: false
  endpoint:
    env:
      enabled: false
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include: readinessState
        liveness:
          include: livenessState
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

otel:
  traces:
    exporter: jaeger
  exporter:
    jaeger:
      endpoint: http://localhost:14250
resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
    instances:
      # PayPal create mints an OAuth token then creates the order — two
      # sequential round-trips to an external sandbox. 10s gives enough
      # headroom without letting a hung downstream block indefinitely.
      payment-service:
        timeout-duration: 10s
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      product-service:
        base-config: default
      search-service:
        base-config: default
      inventory-service:
        base-config: default
      user-service:
        base-config: default
      cart-service:
        base-config: default
      order-service:
        base-config: default
      payment-service:
        base-config: default
      shipping-service:
        base-config: default
      notification-service:
        base-config: default
      recommendations-service:
        base-config: default
      messaging-service:
        base-config: default
      # DEPRECATED - standalone coupon/review/seller-finance routes migrated to order-service/product-service.
      # Rollback: restore matching RouteConfig targets before re-enabling these circuit breakers.

---
spring:
  config:
    activate:
      on-profile: dev

# otel.sdk.trace.sampler.probability removed — use OTEL_TRACES_SAMPLER_ARG env var instead
