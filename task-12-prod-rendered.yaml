apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    app.kubernetes.io/name: keycloak-reconcile
    app.kubernetes.io/part-of: vnshop
  name: vnshop-keycloak-reconcile
  namespace: vnshop-prod
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-reconcile
        app.kubernetes.io/part-of: vnshop
    spec:
      containers:
      - args:
        - |
          export HOME=/home/keycloak
          until /opt/keycloak/bin/kcadm.sh config credentials --server http://keycloak:8080 --realm master --user "$KC_BOOTSTRAP_ADMIN_USERNAME" --password "$KC_BOOTSTRAP_ADMIN_PASSWORD"; do sleep 5; done
          client_id=$(/opt/keycloak/bin/kcadm.sh get clients -r vnshop -q clientId=vnshop-monitoring --fields id --format csv --noquotes)
          if [ -z "$client_id" ]; then
            client_id=$(/opt/keycloak/bin/kcadm.sh create clients -r vnshop -s clientId=vnshop-monitoring -s name='VNShop Monitoring Dashboard' -s protocol=openid-connect -s publicClient=true -s standardFlowEnabled=true -s enabled=true -s 'attributes={"pkce.code.challenge.method":"S256"}' -i)
          fi
          /opt/keycloak/bin/kcadm.sh update clients/$client_id -r vnshop -s redirectUris='["'"$AUTH_ORIGIN"'/monitoring/"]' -s webOrigins='["'"$AUTH_ORIGIN"'"]' -s publicClient=true -s standardFlowEnabled=true -s 'attributes={"pkce.code.challenge.method":"S256"}'
          admin_role_id=$(/opt/keycloak/bin/kcadm.sh get roles/ADMIN -r vnshop --fields id --format csv --noquotes)
          if ! /opt/keycloak/bin/kcadm.sh get clients/$client_id/scope-mappings/realm -r vnshop --fields name --format csv --noquotes | grep -qx ADMIN; then
            printf '[{"id":"%s","name":"ADMIN"}]' "$admin_role_id" > /home/keycloak/admin-role.json
            /opt/keycloak/bin/kcadm.sh create clients/$client_id/scope-mappings/realm -r vnshop -f /home/keycloak/admin-role.json
          fi
          for target in vnshop-gateway vnshop-web vnshop-api; do
            target_id=$(/opt/keycloak/bin/kcadm.sh get clients -r vnshop -q clientId="$target" --fields id --format csv --noquotes)
            if [ -n "$target_id" ]; then
              case "$target" in
                vnshop-gateway) /opt/keycloak/bin/kcadm.sh update clients/$target_id -r vnshop -s redirectUris='["'"$WEB_ORIGIN"'/login/oauth2/code/vnshop-gateway","'"$AUTH_ORIGIN"'/login/oauth2/code/vnshop-gateway"]' -s webOrigins='["'"$WEB_ORIGIN"'","'"$AUTH_ORIGIN"'"]' ;;
                vnshop-web) /opt/keycloak/bin/kcadm.sh update clients/$target_id -r vnshop -s redirectUris='["'"$WEB_ORIGIN"'/*]' -s webOrigins='["'"$WEB_ORIGIN"'"]' ;;
                vnshop-api) /opt/keycloak/bin/kcadm.sh update clients/$target_id -r vnshop -s redirectUris='["'"$AUTH_ORIGIN"'/*]' -s webOrigins='["'"$AUTH_ORIGIN"'"]' ;;
              esac
            fi
          done
          /opt/keycloak/bin/kcadm.sh update realms/vnshop -s enabled=true
        command:
        - sh
        - -ec
        env:
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              key: keycloak-admin-username
              name: vnshop-runtime-secrets
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: keycloak-admin-password
              name: vnshop-runtime-secrets
        - name: GATEWAY_OAUTH2_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: gateway-oauth2-client-secret
              name: vnshop-runtime-secrets
        envFrom:
        - configMapRef:
            name: vnshop-app-config
        image: quay.io/keycloak/keycloak@sha256:0aae0de7fca85525f727d3354df17896092de8bb26ae4c12d89c77e5df8cbce4
        name: keycloak-reconcile
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /home/keycloak
          name: kcadm-home
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir: {}
        name: kcadm-home
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-10"
  name: vnshop-storage-bootstrap
  namespace: vnshop-prod
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vnshop-storage-bootstrap
        app.kubernetes.io/part-of: vnshop
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - |
          until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 5; done
          mc ready local
          mc mb --ignore-existing \
            local/vnshop-products \
            local/vnshop-reviews \
            local/vnshop-avatars \
            local/vnshop-video-uploads-tmp \
            local/vnshop-videos-staging \
            local/vnshop-videos
          mc anonymous set-json /policies/public-products.json local/vnshop-products
          mc anonymous set-json /policies/public-reviews.json local/vnshop-reviews
          mc anonymous set-json /policies/public-avatars.json local/vnshop-avatars
          mc anonymous set-json /policies/public-videos.json local/vnshop-videos
          mc ilm rule add --expire-days 1 local/vnshop-video-uploads-tmp

          configure_user() {
            access_key="$1"
            secret_key="$2"
            policy="$3"
            mc admin policy create local "$policy" "/policies/$policy.json"
            mc admin user add local "$access_key" "$secret_key"
            mc admin policy attach local "$policy" --user "$access_key"
          }
          configure_user "$PRODUCT_ACCESS_KEY" "$PRODUCT_SECRET_KEY" product
          configure_user "$USER_ACCESS_KEY" "$USER_SECRET_KEY" user
          configure_user "$MODERATOR_ACCESS_KEY" "$MODERATOR_SECRET_KEY" moderator
          configure_user "$TRANSCODER_ACCESS_KEY" "$TRANSCODER_SECRET_KEY" transcoder
        command:
        - sh
        - -ec
        env:
        - name: HOME
          value: /tmp
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              key: platform-minio-root-user
              name: vnshop-runtime-secrets
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: platform-minio-root-password
              name: vnshop-runtime-secrets
        - name: PRODUCT_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: product-service-minio-access-key
              name: vnshop-runtime-secrets
        - name: PRODUCT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: product-service-minio-secret-key
              name: vnshop-runtime-secrets
        - name: USER_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: user-service-minio-access-key
              name: vnshop-runtime-secrets
        - name: USER_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: user-service-minio-secret-key
              name: vnshop-runtime-secrets
        - name: MODERATOR_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: video-moderator-minio-access-key
              name: vnshop-runtime-secrets
        - name: MODERATOR_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: video-moderator-minio-secret-key
              name: vnshop-runtime-secrets
        - name: TRANSCODER_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: video-transcoder-minio-access-key
              name: vnshop-runtime-secrets
        - name: TRANSCODER_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: video-transcoder-minio-secret-key
              name: vnshop-runtime-secrets
        image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
        name: bootstrap
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /policies
          name: policies
          readOnly: true
        - mountPath: /tmp
          name: tmp
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: vnshop-storage-bootstrap
      volumes:
      - configMap:
          name: vnshop-storage-policies
        name: policies
      - emptyDir: {}
        name: tmp
