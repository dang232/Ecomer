      - args:
        - start
        - --http-enabled=true
        - --proxy-headers=xforwarded
        - --import-realm
        env:
        - name: GATEWAY_OAUTH2_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: gateway-oauth2-client-secret
              name: vnshop-runtime-secrets
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL
          value: jdbc:postgresql://postgres:5432/vnshop
        - name: KC_DB_SCHEMA
          value: keycloak
        - name: KC_HOSTNAME
          valueFrom:
            configMapKeyRef:
              key: AUTH_ORIGIN
              name: vnshop-app-config
        - name: KC_DB_USERNAME
          valueFrom:
            secretKeyRef:
              key: keycloak-db-username
              name: vnshop-runtime-secrets
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: keycloak-db-password
              name: vnshop-runtime-secrets
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              key: keycloak-admin-username
              name: vnshop-runtime-secrets
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: keycloak-admin-password
              name: vnshop-runtime-secrets
        image: quay.io/keycloak/keycloak@sha256:0aae0de7fca85525f727d3354df17896092de8bb26ae4c12d89c77e5df8cbce4
        name: keycloak
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          failureThreshold: 12
          httpGet:
            path: /realms/master
            port: http
          periodSeconds: 10
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /opt/keycloak/data/import
          name: realm
          readOnly: true
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          name: vnshop-keycloak-realm
        name: realm
