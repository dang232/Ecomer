apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-10"
  name: vnshop-kafka-bootstrap
  namespace: vnshop-prod
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vnshop-kafka-bootstrap
        app.kubernetes.io/part-of: vnshop
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - bash
        - /opt/vnshop/init-kafka-topics.sh
        env:
        - name: KAFKA_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: platform-kafka-admin-password
              name: vnshop-runtime-secrets
        - name: KAFKA_SSL_TRUSTSTORE_LOCATION
          value: /etc/kafka/tls/ca.truststore.jks
        - name: KAFKA_SSL_KEYSTORE_LOCATION
          value: /etc/kafka/tls/admin.keystore.jks
        - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: platform-kafka-truststore-password
              name: vnshop-runtime-secrets
        - name: KAFKA_SSL_KEYSTORE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: platform-kafka-admin-keystore-password
              name: vnshop-runtime-secrets
        image: confluentinc/cp-kafka@sha256:acbbf674f2ed40e5d0a8ca51beb0f00692c866fc22b5ce06f8cadbdc54cd4436
        name: bootstrap
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 25m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /opt/vnshop/init-kafka-topics.sh
          name: script
          readOnly: true
          subPath: init-kafka-topics.sh
        - mountPath: /opt/vnshop/infra/kafka/topic-inventory.yaml
          name: inventory
          readOnly: true
          subPath: topic-inventory.yaml
        - mountPath: /tmp
          name: tmp
        - mountPath: /etc/kafka/tls
          name: kafka-tls
          readOnly: true
        workingDir: /opt/vnshop
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: vnshop-kafka-bootstrap
      volumes:
      - configMap:
          defaultMode: 365
          items:
          - key: init-kafka-topics.sh
            path: init-kafka-topics.sh
          name: vnshop-kafka-bootstrap
        name: script
      - configMap:
          items:
          - key: topic-inventory.yaml
            path: topic-inventory.yaml
