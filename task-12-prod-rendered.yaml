apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    vnshop.io/kafka-authority: production-kraft-v1
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: vnshop
  name: kafka
  namespace: vnshop-prod
spec:
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  serviceName: kafka-headless
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: vnshop
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - /bin/bash
        - /opt/kafka/broker-jaas-entrypoint.sh
        env:
        - name: KAFKA_PROCESS_ROLES
          value: broker,controller
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 0@kafka-0.kafka-headless:9093,1@kafka-1.kafka-headless:9093,2@kafka-2.kafka-headless:9093
        - name: KAFKA_LISTENERS
          value: CLIENT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:9094
        - name: KAFKA_ADVERTISED_LISTENERS
          value: CLIENT://kafka:9092,INTERNAL://$(POD_NAME).kafka-headless:9094
        - name: KAFKA_SASL_ENABLED_MECHANISMS
          value: PLAIN
        - name: KAFKA_DEFAULT_REPLICATION_FACTOR
          value: "3"
        - name: KAFKA_MIN_INSYNC_REPLICAS
          value: "2"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "3"
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: "3"
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: "2"
        - name: KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE
          value: "false"
        - name: KAFKA_NUM_PARTITIONS
          value: "6"
        - name: KAFKA_LOG_RETENTION_HOURS
          value: "168"
        - name: KAFKA_LOG_DIRS
          value: /var/lib/kafka/data
        - name: KAFKA_LISTENER_NAME_CLIENT_SASL_ENABLED_MECHANISMS
          value: PLAIN
        - name: KAFKA_LISTENER_NAME_CLIENT_SSL_CLIENT_AUTH
          value: required
        - name: KAFKA_LISTENER_NAME_INTERNAL_SSL_CLIENT_AUTH
          value: required
        - name: KAFKA_LISTENER_NAME_CONTROLLER_SSL_CLIENT_AUTH
          value: required
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: CLIENT:SASL_SSL,CONTROLLER:SSL,INTERNAL:SSL
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: INTERNAL
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: "false"
        - name: KAFKA_AUTHORIZER_CLASS_NAME
          value: org.apache.kafka.metadata.authorizer.StandardAuthorizer
        - name: KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND
          value: "false"
        - name: KAFKA_SUPER_USERS
          value: User:kafka-node;User:kafka-admin
        - name: KAFKA_SSL_PRINCIPAL_MAPPING_RULES
          value: RULE:^CN=(kafka-node),O=VNShop$/$1/,DEFAULT
        - name: KAFKA_SSL_CLIENT_AUTH
          value: required
        - name: KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM
          value: HTTPS
        - name: KAFKA_SSL_KEYSTORE_TYPE
          value: JKS
        - name: KAFKA_SSL_TRUSTSTORE_TYPE
          value: JKS
        - name: KAFKA_SSL_KEYSTORE_LOCATION
          value: /etc/kafka/tls/broker.keystore.jks
        - name: KAFKA_SSL_TRUSTSTORE_LOCATION
          value: /etc/kafka/tls/ca.truststore.jks
        - name: KAFKA_SSL_KEY_PASSWORD
          valueFrom:
            secretKeyRef:
              key: platform-kafka-broker-keystore-password
              name: vnshop-runtime-secrets
        - name: KAFKA_SSL_KEYSTORE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: platform-kafka-broker-keystore-password
              name: vnshop-runtime-secrets
        - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: platform-kafka-truststore-password
              name: vnshop-runtime-secrets
        - name: CLUSTER_ID
          valueFrom:
            secretKeyRef:
              key: platform-kafka-cluster-id
              name: vnshop-runtime-secrets
        image: confluentinc/cp-kafka@sha256:acbbf674f2ed40e5d0a8ca51beb0f00692c866fc22b5ce06f8cadbdc54cd4436
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -ec
            - test -r /etc/kafka/tls/ca.truststore.jks -a -r /etc/kafka/tls/admin.keystore.jks
              -a -r /etc/kafka/tls/admin.properties && kafka-broker-api-versions --bootstrap-server
              kafka:9092 --command-config /etc/kafka/tls/admin.properties >/dev/null
          failureThreshold: 3
          initialDelaySeconds: 90
          periodSeconds: 20
          timeoutSeconds: 8
        name: kafka
        ports:
        - containerPort: 9092
          name: client
        - containerPort: 9093
          name: controller
        - containerPort: 9094
          name: internal
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -ec
            - test -r /etc/kafka/tls/ca.truststore.jks -a -r /etc/kafka/tls/admin.keystore.jks
              -a -r /etc/kafka/tls/admin.properties && kafka-broker-api-versions --bootstrap-server
              kafka:9092 --command-config /etc/kafka/tls/admin.properties >/dev/null
          failureThreshold: 6
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 8
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          exec:
            command:
            - /bin/bash
            - -ec
            - test -r /etc/kafka/tls/ca.truststore.jks -a -r /etc/kafka/tls/admin.keystore.jks
              -a -r /etc/kafka/tls/admin.properties && kafka-broker-api-versions --bootstrap-server
              kafka:9092 --command-config /etc/kafka/tls/admin.properties >/dev/null
          failureThreshold: 30
          periodSeconds: 10
          timeoutSeconds: 8
        volumeMounts:
        - mountPath: /var/lib/kafka/data
          name: kafka-data
        - mountPath: /opt/kafka/broker-jaas-entrypoint.sh
          name: kafka-jaas-script
          readOnly: true
          subPath: broker-jaas-entrypoint.sh
        - mountPath: /run/kafka-jaas
          name: kafka-jaas-runtime
        - mountPath: /run/kafka-credentials
          name: kafka-credentials
          readOnly: true
        - mountPath: /etc/kafka/tls
          name: kafka-tls
          readOnly: true
      enableServiceLinks: false
      initContainers:
      - args:
        - |
          ordinal="${HOSTNAME##*-}"
          test "$ordinal" = 0 -o "$ordinal" = 1 -o "$ordinal" = 2
          mkdir -p /run/kafka-init
          umask 077
          cat > /run/kafka-init/server.properties <<EOF
          process.roles=broker,controller
          node.id=$ordinal
          controller.quorum.voters=0@kafka-0.kafka-headless:9093,1@kafka-1.kafka-headless:9093,2@kafka-2.kafka-headless:9093
          controller.listener.names=CONTROLLER
          listeners=CLIENT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:9094
          listener.security.protocol.map=CLIENT:SASL_SSL,CONTROLLER:SSL,INTERNAL:SSL
          inter.broker.listener.name=INTERNAL
          advertised.listeners=CLIENT://kafka:9092,INTERNAL://kafka-$ordinal.kafka-headless:9094
          log.dirs=/var/lib/kafka/data
          ssl.client.auth=required
          ssl.endpoint.identification.algorithm=HTTPS
          ssl.keystore.type=JKS
          ssl.truststore.type=JKS
          ssl.keystore.location=/etc/kafka/tls/broker.keystore.jks
          ssl.truststore.location=/etc/kafka/tls/ca.truststore.jks
          EOF
          if [ ! -f /var/lib/kafka/data/meta.properties ]; then
            kafka-storage format --config /run/kafka-init/server.properties --cluster-id "$CLUSTER_ID" --ignore-formatted
          fi
        command:
        - /bin/bash
        - -ec
        env:
        - name: CLUSTER_ID
          valueFrom:
            secretKeyRef:
              key: platform-kafka-cluster-id
              name: vnshop-runtime-secrets
        - name: KAFKA_SSL_KEYSTORE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: platform-kafka-broker-keystore-password
              name: vnshop-runtime-secrets
        - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: platform-kafka-truststore-password
              name: vnshop-runtime-secrets
        image: confluentinc/cp-kafka@sha256:acbbf674f2ed40e5d0a8ca51beb0f00692c866fc22b5ce06f8cadbdc54cd4436
        imagePullPolicy: IfNotPresent
        name: kafka-init
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /var/lib/kafka/data
          name: kafka-data
        - mountPath: /run/kafka-init
          name: kafka-init-runtime
        - mountPath: /etc/kafka/tls
          name: kafka-tls
          readOnly: true
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kafka
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: kafka
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: kafka
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
      volumes:
      - configMap:
          name: kafka-config
        name: kafka-config
      - emptyDir:
          medium: Memory
        name: kafka-init-runtime
      - configMap:
          defaultMode: 365
          name: kafka-config
        name: kafka-jaas-script
      - emptyDir:
          medium: Memory
        name: kafka-jaas-runtime
      - name: kafka-credentials
        secret:
          items:
          - key: order-service-kafka-username
            path: svc-order.username
          - key: order-service-kafka-password
            path: svc-order.password
          - key: payment-service-kafka-username
            path: svc-payment.username
          - key: payment-service-kafka-password
            path: svc-payment.password
          - key: inventory-service-kafka-username
            path: svc-inventory.username
          - key: inventory-service-kafka-password
            path: svc-inventory.password
          - key: product-service-kafka-username
            path: svc-product.username
          - key: product-service-kafka-password
            path: svc-product.password
          - key: shipping-service-kafka-username
            path: svc-shipping.username
          - key: shipping-service-kafka-password
            path: svc-shipping.password
          - key: search-service-kafka-username
            path: svc-search.username
          - key: search-service-kafka-password
            path: svc-search.password
          - key: recommendations-service-kafka-username
            path: svc-recommendations.username
          - key: recommendations-service-kafka-password
            path: svc-recommendations.password
          - key: seller-finance-service-kafka-username
            path: svc-finance.username
          - key: seller-finance-service-kafka-password
            path: svc-finance.password
          - key: notification-service-kafka-username
            path: svc-notification.username
          - key: notification-service-kafka-password
            path: svc-notification.password
          - key: messaging-service-kafka-username
            path: svc-messaging.username
          - key: messaging-service-kafka-password
            path: svc-messaging.password
          - key: invoice-service-kafka-username
            path: svc-invoice.username
          - key: invoice-service-kafka-password
            path: svc-invoice.password
          - key: user-service-kafka-username
            path: svc-user.username
          - key: user-service-kafka-password
            path: svc-user.password
          - key: video-transcoder-kafka-username
            path: svc-video-transcoder.username
          - key: video-transcoder-kafka-password
            path: svc-video-transcoder.password
          - key: video-moderator-kafka-username
            path: svc-video-moderator.username
          - key: video-moderator-kafka-password
            path: svc-video-moderator.password
          - key: platform-kafka-admin-username
            path: kafka-admin.username
          - key: platform-kafka-admin-password
            path: kafka-admin.password
          secretName: vnshop-runtime-secrets
      - name: kafka-tls
        secret:
          items:
          - key: platform-kafka-broker-keystore
            path: broker.keystore.jks
          - key: platform-kafka-admin-keystore
            path: admin.keystore.jks
          - key: platform-kafka-truststore
            path: ca.truststore.jks
          - key: platform-kafka-admin-client-properties
            path: admin.properties
          secretName: vnshop-runtime-secrets
  updateStrategy:
    type: RollingUpdate
  volumeClaimTemplates:
  - metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: vnshop
      name: kafka-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 100Gi
      storageClassName: standard-rwo
