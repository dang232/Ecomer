apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
    vnshop.io/authority: self-managed-elasticsearch-ha
    vnshop.io/bootstrap-lifecycle: bootstrap-only-cluster-initial-master-nodes
    vnshop.io/replacement-lifecycle: preserve-pvc-and-cluster-uuid-before-rejoin
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: vnshop
  name: elasticsearch
  namespace: vnshop-prod
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  serviceName: elasticsearch-headless
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/part-of: vnshop-elasticsearch
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: elasticsearch
            topologyKey: kubernetes.io/hostname
      containers:
      - args:
        - |
          shopt -s nullglob
          state_files=(/usr/share/elasticsearch/data/nodes/0/_state/global-*.st)
          if (( ${#state_files[@]} == 0 )); then
            exec /usr/local/bin/docker-entrypoint.sh elasticsearch -E cluster.initial_master_nodes=elasticsearch-0,elasticsearch-1,elasticsearch-2
          fi
          exec /usr/local/bin/docker-entrypoint.sh
        command:
        - bash
        - -ec
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: discovery.seed_hosts
          value: elasticsearch-0.elasticsearch-headless,elasticsearch-1.elasticsearch-headless,elasticsearch-2.elasticsearch-headless
        - name: network.publish_host
          value: $(POD_NAME).elasticsearch-headless
        - name: node.roles
          value: master,data,ingest
        - name: cluster.name
          value: vnshop-search
        - name: xpack.security.enabled
          value: "true"
        - name: xpack.security.http.ssl.enabled
          value: "true"
        - name: xpack.security.http.ssl.certificate
          value: /usr/share/elasticsearch/config/certs/tls.crt
        - name: xpack.security.http.ssl.key
          value: /usr/share/elasticsearch/config/certs/tls.key
        - name: xpack.security.http.ssl.certificate_authorities
          value: /usr/share/elasticsearch/config/certs/ca.crt
        - name: xpack.security.transport.ssl.enabled
          value: "true"
        - name: xpack.security.transport.ssl.verification_mode
          value: full
        - name: xpack.security.transport.ssl.certificate
          value: /usr/share/elasticsearch/config/certs/tls.crt
        - name: xpack.security.transport.ssl.key
          value: /usr/share/elasticsearch/config/certs/tls.key
        - name: xpack.security.transport.ssl.certificate_authorities
          value: /usr/share/elasticsearch/config/certs/ca.crt
        - name: ES_JAVA_OPTS
          value: -Xms1g -Xmx1g
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              key: platform-elasticsearch-elastic-password
              name: vnshop-runtime-secrets
        - name: ELASTICSEARCH_OPERATOR_PASSWORD
          valueFrom:
            secretKeyRef:
              key: platform-elasticsearch-operator-password
              name: vnshop-runtime-secrets
        image: docker.elastic.co/elasticsearch/elasticsearch@sha256:754c3d8ca6f74acba58eb0610b8479a13c36df09ac1a4e0f2667dc167d377b84
        livenessProbe:
          failureThreshold: 6
          periodSeconds: 20
          tcpSocket:
            port: https
          timeoutSeconds: 5
        name: elasticsearch
        ports:
        - containerPort: 9200
          name: https
        - containerPort: 9300
          name: transport
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - curl --fail --silent --show-error --cacert /usr/share/elasticsearch/config/certs/ca.crt
              --user "operator:${ELASTICSEARCH_OPERATOR_PASSWORD}" https://${HOSTNAME}.elasticsearch-headless:9200/_cluster/health?wait_for_status=yellow
          failureThreshold: 12
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "2"
            memory: 3Gi
          requests:
            cpu: 500m
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          exec:
            command:
            - sh
            - -ec
            - curl --fail --silent --show-error --cacert /usr/share/elasticsearch/config/certs/ca.crt
              --user "operator:${ELASTICSEARCH_OPERATOR_PASSWORD}" https://${HOSTNAME}.elasticsearch-headless:9200/_security/_authenticate
          failureThreshold: 60
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /usr/share/elasticsearch/data
          name: data
        - mountPath: /usr/share/elasticsearch/config
          name: elasticsearch-config
      initContainers:
      - args:
        - |
          umask 077
          test -n "$ELASTICSEARCH_ELASTIC_PASSWORD"
          test -n "$ELASTICSEARCH_OPERATOR_PASSWORD"
          test -n "$ELASTICSEARCH_SEARCH_PASSWORD"
          test "$ELASTICSEARCH_ELASTIC_PASSWORD" != "$ELASTICSEARCH_OPERATOR_PASSWORD"
          test "$ELASTICSEARCH_ELASTIC_PASSWORD" != "$ELASTICSEARCH_SEARCH_PASSWORD"
          test "$ELASTICSEARCH_OPERATOR_PASSWORD" != "$ELASTICSEARCH_SEARCH_PASSWORD"
          rm -rf /identity/*
          cp -r /usr/share/elasticsearch/config/. /identity/
          mkdir -p /identity/certs
           cat /tls/ca.crt > /identity/certs/ca.crt
           cat /tls/tls.crt > /identity/certs/tls.crt
           cat /tls/tls.key > /identity/certs/tls.key
          chmod 400 /identity/certs/ca.crt /identity/certs/tls.crt /identity/certs/tls.key
          cat > /identity/roles.yml <<'EOF'
          search_service:
            cluster: [monitor]
            indices:
            - names: [products]
              privileges: [read, view_index_metadata]
          operator:
            cluster: [all]
            indices:
            - names: ["*"]
              privileges: [all]
          EOF
          test -s /identity/roles.yml
          ES_PATH_CONF=/identity /usr/share/elasticsearch/bin/elasticsearch-users useradd operator -p "$ELASTICSEARCH_OPERATOR_PASSWORD" -r operator
          ES_PATH_CONF=/identity /usr/share/elasticsearch/bin/elasticsearch-users useradd search-service -p "$ELASTICSEARCH_SEARCH_PASSWORD" -r search_service
          cat > /identity/role_mapping.yml <<'EOF'
          search_service:
          - "user:search-service"
          operator:
          - "user:operator"
          EOF
          for file in /identity/users /identity/users_roles /identity/roles.yml /identity/role_mapping.yml /identity/certs/ca.crt /identity/certs/tls.crt /identity/certs/tls.key; do
            test -s "$file"
            mode="$(stat -c '%a' "$file")"
            test "$mode" = 600 -o "$mode" = 400
          done
        command:
        - bash
        - -ec
        env:
        - name: ELASTICSEARCH_ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              key: platform-elasticsearch-elastic-password
              name: vnshop-runtime-secrets
        - name: ELASTICSEARCH_OPERATOR_PASSWORD
          valueFrom:
            secretKeyRef:
              key: platform-elasticsearch-operator-password
              name: vnshop-runtime-secrets
        - name: ELASTICSEARCH_SEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              key: search-service-elasticsearch-password
              name: vnshop-runtime-secrets
        image: docker.elastic.co/elasticsearch/elasticsearch@sha256:754c3d8ca6f74acba58eb0610b8479a13c36df09ac1a4e0f2667dc167d377b84
        name: generate-file-realm
        volumeMounts:
        - mountPath: /identity
          name: elasticsearch-config
        - mountPath: /tls
          name: elasticsearch-tls
          readOnly: true
      - args:
        - |
          ordinal="${HOSTNAME##*-}"
          test "$ordinal" -ge 0 -a "$ordinal" -le 2
          test -f /tls/ca.crt -a -f /tls/tls.crt -a -f /tls/tls.key
        command:
        - sh
        - -ec
        image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        name: validate-tls-and-ordinal
        volumeMounts:
        - mountPath: /tls
          name: elasticsearch-tls
          readOnly: true
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 120
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: elasticsearch
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
      volumes:
      - emptyDir:
          medium: Memory
        name: elasticsearch-config
      - name: elasticsearch-tls
        secret:
          defaultMode: 288
          secretName: elasticsearch-http-transport-tls
  volumeClaimTemplates:
  - metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 50Gi
      storageClassName: fast-ssd
