apiVersion: v1
data:
  bootstrap-lifecycle.yml: |
    mode: bootstrap-only
    initial_master_nodes: [elasticsearch-0, elasticsearch-1, elasticsearch-2]
    existing_pvc: preserve-ordinal-pvc-and-cluster-uuid
    replacement: verify-cluster-uuid-before-rejoin
    mismatch: fail-closed-on-cluster-uuid-or-pvc-identity-mismatch
    recovery: operator-confirmed-new-cluster-only
  reindex.md: |
    Reindex procedure is operator-only: pause product projection consumers, create a versioned index,
    apply the product mapping/settings, reindex from the PostgreSQL read model, verify document counts,
    aliases and sample queries, then atomically switch the alias and resume consumers. HTTP fallback
    is not a production path.
  restore-security-index.md: |
    Restore procedure is operator-only and must use authenticated HTTPS with the operator principal.
    Restore the `.security-7` index before application indices; verify role mappings and authenticate
    both principals before reopening search-service traffic. Never restore security state into the
    source cluster or overwrite a live security index.
  role-mappings.yml: |
    search_service:
      users: [search-service]
    operator:
      users: [operator]
  roles.yml: |
    search_service:
      cluster: [monitor]
      indices:
      - names: [products]
        privileges: [read, view_index_metadata]
    operator:
      cluster: [all]
      indices: [{names: ["*"], privileges: [all]}]
  tls-contract.yml: |
    secret: elasticsearch-http-transport-tls
    ca_key: ca.crt
    certificate_key: tls.crt
    private_key: tls.key
    required_sans: [elasticsearch, elasticsearch-headless, elasticsearch-0.elasticsearch-headless, elasticsearch-1.elasticsearch-headless, elasticsearch-2.elasticsearch-headless]
    required_eku: [serverAuth, clientAuth]
    hostname_verification: full
    missing_or_invalid_material: fail-closed
kind: ConfigMap
metadata:
  annotations:
    vnshop.io/contract: security-index-role-mapping-reindex
  name: elasticsearch-security-contract
  namespace: vnshop-prod
---
apiVersion: v1
data:
  broker-jaas-entrypoint.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    umask 077
    output=/run/kafka-jaas/kafka_server_jaas.conf
    : > "$output"
    printf '%s\n' 'client.KafkaServer {' '  org.apache.kafka.common.security.plain.PlainLoginModule required' > "$output"
    shopt -s nullglob
    username_files=(/run/kafka-credentials/*.username)
    test "${#username_files[@]}" = 15
    declare -A seen_principals=()
    for username_file in "${username_files[@]}"; do
      test -r "$username_file"
      expected_principal="${username_file##*/}"
      expected_principal="${expected_principal%.username}"
      [[ "$expected_principal" =~ ^[A-Za-z0-9._-]+$ ]]
      password_file="${username_file%.username}.password"
      test -r "$password_file"
      original_hash=$(sha256sum "$username_file" | awk '{print $1}')
      sanitized_hash=$(LC_ALL=C tr -d '\000' < "$username_file" | sha256sum | awk '{print $1}')
      test "$original_hash" = "$sanitized_hash"
      original_hash=$(sha256sum "$password_file" | awk '{print $1}')
      sanitized_hash=$(LC_ALL=C tr -d '\000' < "$password_file" | sha256sum | awk '{print $1}')
      test "$original_hash" = "$sanitized_hash"
      IFS= read -r -d '' username < "$username_file" || true
      IFS= read -r -d '' password < "$password_file" || true
      test -s "$username_file" -a -s "$password_file"
      [[ "$username" == "$expected_principal" ]]
      [[ -z "${seen_principals[$username]+present}" ]]
      seen_principals[$username]=1
      ! LC_ALL=C grep -q '[[:cntrl:]]' "$username_file"
      ! LC_ALL=C grep -q '[[:cntrl:]]' "$password_file"
      ! LC_ALL=C grep -q '"' "$username_file"
      ! LC_ALL=C grep -q '"' "$password_file"
      test "${username//\\/}" = "$username"
      test "${password//\\/}" = "$password"
      [[ "$username" != *'"'* && "$username" != *'\\'* && "$password" != *'"'* && "$password" != *'\\'* ]]
      [[ "$username" =~ ^[A-Za-z0-9._-]+$ ]]
      printf '  user_%s="%s"\n' "$username" "$password" >> "$output"
    done
    printf '%s\n' '  ;' '};' >> "$output"
    chmod 600 "$output"
    export KAFKA_OPTS="${KAFKA_OPTS:-} -Djava.security.auth.login.config=$output"
    export KAFKA_NODE_ID="${HOSTNAME##*-}"
    test "$KAFKA_NODE_ID" = 0 -o "$KAFKA_NODE_ID" = 1 -o "$KAFKA_NODE_ID" = 2
    exec /etc/confluent/docker/run
