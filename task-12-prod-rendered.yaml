kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  name: vnshop-keycloak-realm
  namespace: vnshop-prod
---
apiVersion: v1
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: operations-webhook
      group_by: [alertname, artifact_id]
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 3h
      routes:
      - matchers: ['severity="critical"']
        receiver: operations-webhook
        repeat_interval: 15m
    receivers:
    - name: operations-webhook
      webhook_configs:
      - url_file: /etc/alertmanager/secrets/webhook-url
        send_resolved: true
  alerts.yml: |
    groups:
    - name: vnshop-portfolio-slo
      rules:
      - alert: VNShopArtifactUnavailable
        expr: probe_success{job="vnshop-readiness"} == 0
        for: 2m
        labels: {severity: critical, owner: operations}
        annotations:
          summary: "{{ $labels.artifact_id }} readiness failed"
          description: "{{ $labels.instance }} has failed the locked readiness path for two minutes."
      - alert: VNShopAvailabilityFastBurn
        expr: (1 - avg_over_time(probe_success{job="vnshop-readiness"}[1h])) > 0.144
        for: 2m
        labels: {severity: critical, owner: operations}
        annotations:
          summary: "{{ $labels.artifact_id }} is burning the 99.0% availability budget quickly"
      - alert: VNShopAvailabilitySlowBurn
        expr: (1 - avg_over_time(probe_success{job="vnshop-readiness"}[3d])) > 0.03
        for: 15m
        labels: {severity: warning, owner: operations}
        annotations:
          summary: "{{ $labels.artifact_id }} is burning the 99.0% availability budget"
      - alert: VNShopAvailabilitySLOBreach
        expr: avg_over_time(probe_success{job="vnshop-readiness"}[30d]) < 0.99
        for: 15m
        labels: {severity: warning, owner: operations}
        annotations:
          summary: "{{ $labels.artifact_id }} is below the 99.0% rolling availability objective"
      - alert: VNShopBackupTelemetryMissing
        expr: absent(vnshop_backup_last_success_timestamp_seconds)
        for: 30m
        labels: {severity: critical, owner: operations}
        annotations: {summary: "No successful authoritative backup has been recorded"}
      - alert: VNShopBackupRPOAtRisk
        expr: time() - vnshop_backup_last_success_timestamp_seconds > 86400
        for: 5m
        labels: {severity: critical, owner: operations}
        annotations: {summary: "The latest authoritative backup is older than the 24 hour RPO"}
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          method: GET
          preferred_ip_protocol: ip4
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        platform: vnshop-portfolio
    rule_files: [/etc/prometheus/rules/*.yml]
    alerting:
      alertmanagers:
      - static_configs:
        - targets: [alertmanager:9093]
    scrape_configs:
    - job_name: prometheus
      static_configs:
      - targets: [localhost:9090]
    - job_name: vnshop-readiness
      metrics_path: /probe
      params: {module: [http_2xx]}
      static_configs:
            - targets: ["http://frontend:8080/healthz"]
              labels: {artifact_id: "frontend"}
            - targets: ["http://api-gateway:8080/actuator/health/readiness"]
              labels: {artifact_id: "api-gateway"}
            - targets: ["http://cart-service:8084/ready"]
              labels: {artifact_id: "cart-service"}
            - targets: ["http://configuration-service:8097/ready"]
              labels: {artifact_id: "configuration-service"}
            - targets: ["http://inventory-service:8083/actuator/health/readiness"]
              labels: {artifact_id: "inventory-service"}
            - targets: ["http://invoice-service:8098/actuator/health/readiness"]
              labels: {artifact_id: "invoice-service"}
            - targets: ["http://messaging-service:8095/ready"]
              labels: {artifact_id: "messaging-service"}
            - targets: ["http://monitoring-service-v2:8096/ready"]
              labels: {artifact_id: "monitoring-service-v2"}
            - targets: ["http://notification-service:8087/ready"]
              labels: {artifact_id: "notification-service"}
            - targets: ["http://order-service:8091/actuator/health/readiness"]
              labels: {artifact_id: "order-service"}
            - targets: ["http://payment-service:8092/actuator/health/readiness"]
              labels: {artifact_id: "payment-service"}
            - targets: ["http://product-service:8082/actuator/health/readiness"]
              labels: {artifact_id: "product-service"}
            - targets: ["http://recommendations-service:8094/actuator/health/readiness"]
              labels: {artifact_id: "recommendations-service"}
            - targets: ["http://search-service:8086/actuator/health/readiness"]
              labels: {artifact_id: "search-service"}
            - targets: ["http://seller-finance-service:8090/actuator/health/readiness"]
              labels: {artifact_id: "seller-finance-service"}
            - targets: ["http://shipping-service:8093/actuator/health/readiness"]
              labels: {artifact_id: "shipping-service"}
            - targets: ["http://user-service:8081/actuator/health/readiness"]
              labels: {artifact_id: "user-service"}
            - targets: ["http://video-moderator:8100/ready"]
              labels: {artifact_id: "video-moderator"}
            - targets: ["http://video-transcoder:8098/actuator/health/readiness"]
              labels: {artifact_id: "video-transcoder"}
      relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
    - job_name: vnshop-backup
      static_configs:
      - targets: [prometheus-pushgateway:9091]
