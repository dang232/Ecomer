apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  name: vnshop-authoritative-backup
  namespace: vnshop-prod
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 10800
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vnshop-authoritative-backup
            app.kubernetes.io/part-of: vnshop
        spec:
          automountServiceAccountToken: false
          containers:
          - args:
            - |
              prune() {
                prefix="$1"
                keep="$2"
                aws s3api list-objects-v2 --bucket "$BACKUP_BUCKET" --prefix "$prefix/" --delimiter / \
                  --query 'CommonPrefixes[].Prefix' --output text \
                  | tr '\t' '\n' | sort -r | tail -n "+$((keep + 1))" \
                  | while read -r expired; do
                      [ -z "$expired" ] || aws s3 rm "s3://${BACKUP_BUCKET}/${expired}" --recursive --only-show-errors
                    done
              }
              stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
              aws s3 sync /backup "s3://${BACKUP_BUCKET}/${BACKUP_PREFIX}/daily/${stamp}/" --sse AES256 --only-show-errors
              if [ "$(TZ=Asia/Bangkok date +%u)" = "7" ]; then
                aws s3 sync /backup "s3://${BACKUP_BUCKET}/${BACKUP_PREFIX}/weekly/${stamp}/" --sse AES256 --only-show-errors
              fi
              prune "${BACKUP_PREFIX}/daily" 14
              prune "${BACKUP_PREFIX}/weekly" 8
              date -u +%s > /backup/.completed-at
            command:
            - /bin/sh
            - -ec
            env:
            - name: HOME
              value: /tmp
            - name: BACKUP_BUCKET
              valueFrom:
                secretKeyRef:
                  key: backup-s3-bucket
                  name: vnshop-runtime-secrets
            - name: BACKUP_PREFIX
              valueFrom:
                secretKeyRef:
                  key: backup-s3-prefix
                  name: vnshop-runtime-secrets
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: backup-s3-access-key-id
                  name: vnshop-runtime-secrets
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: backup-s3-secret-access-key
                  name: vnshop-runtime-secrets
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  key: backup-s3-region
                  name: vnshop-runtime-secrets
            image: amazon/aws-cli@sha256:964336bffb17b82d2e84a2526b0672e70a2c881544e1a281acaca1d9aa41b536
            name: upload
            resources:
              limits:
                cpu: "1"
                memory: 512Mi
              requests:
                cpu: 50m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /backup
              name: backup
            - mountPath: /tmp
              name: tmp
          - args:
            - |
              for attempt in $(seq 1 1080); do
                if [ -s /backup/.completed-at ]; then
                  printf 'vnshop_backup_last_success_timestamp_seconds %s\n' "$(cat /backup/.completed-at)" > /tmp/metrics
                  wget -qO- --header='Content-Type: text/plain' --post-file=/tmp/metrics \
                    http://prometheus-pushgateway:9091/metrics/job/vnshop-backup
                  exit 0
                fi
                sleep 10
              done
              exit 1
            command:
            - sh
            - -ec
            image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
            name: publish-success-metric
            resources:
              limits:
                cpu: 50m
                memory: 32Mi
              requests:
                cpu: 5m
                memory: 8Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /backup
              name: backup
            - mountPath: /tmp
              name: tmp
          initContainers:
          - command:
            - sh
            - -ec
            - pg_dumpall --clean --if-exists | gzip -9 > /backup/postgresql.sql.gz
            env:
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              value: vnshop
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  key: platform-postgres-admin-username
                  name: vnshop-runtime-secrets
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: platform-postgres-admin-password
                  name: vnshop-runtime-secrets
            image: postgres@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
            name: postgresql
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /backup
              name: backup
            - mountPath: /tmp
              name: tmp
          - command:
            - sh
            - -ec
            - pg_dumpall --clean --if-exists | gzip -9 > /backup/timescaledb.sql.gz
            env:
            - name: PGHOST
              value: timescaledb
            - name: PGDATABASE
              value: monitoring
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  key: platform-timescale-username
                  name: vnshop-runtime-secrets
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: platform-timescale-password
                  name: vnshop-runtime-secrets
            image: postgres@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
            name: timescaledb
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /backup
              name: backup
            - mountPath: /tmp
              name: tmp
          - command:
            - sh
            - -ec
            - mongodump --uri="$MONGODB_URI" --archive=/backup/mongodb.archive --gzip
            env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  key: platform-mongo-backup-uri
                  name: vnshop-runtime-secrets
            image: mongo@sha256:951c2ff9fc6bdb6cb89b1dfea4a0e8ae3ee4fb287c0bf579b2bba54c7803f75d
            name: mongodb
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /backup
              name: backup
            - mountPath: /tmp
              name: tmp
          - command:
            - sh
            - -ec
            - mc alias set source http://minio:9000 "$MINIO_USER" "$MINIO_PASSWORD"
              && mc mirror --overwrite source /backup/minio
            env:
            - name: HOME
              value: /tmp
            - name: MINIO_USER
              valueFrom:
                secretKeyRef:
                  key: platform-minio-root-user
                  name: vnshop-runtime-secrets
            - name: MINIO_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: platform-minio-root-password
                  name: vnshop-runtime-secrets
            image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
            name: minio
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /backup
              name: backup
            - mountPath: /tmp
              name: tmp
          restartPolicy: Never
          securityContext:
            fsGroup: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: vnshop-backup
          volumes:
          - emptyDir:
              sizeLimit: 50Gi
            name: backup
          - emptyDir: {}
            name: tmp
  schedule: 0 2 * * *
  successfulJobsHistoryLimit: 3
  timeZone: Asia/Bangkok
