# Production Kafka authority. Certificates and passwords are external SealedSecret data.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: vnshop
data:
  server.properties: |
    process.roles=broker,controller
    default.replication.factor=3
    min.insync.replicas=2
    offsets.topic.replication.factor=3
    transaction.state.log.replication.factor=3
    transaction.state.log.min.isr=2
    unclean.leader.election.enable=false
    auto.create.topics.enable=false
    authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
    allow.everyone.if.no.acl.found=false
    super.users=User:kafka-controller;User:kafka-admin
    ssl.client.auth=required
    ssl.endpoint.identification.algorithm=HTTPS
    ssl.keystore.type=JKS
    ssl.truststore.type=JKS
    ssl.keystore.location=/etc/kafka/tls/broker.keystore.jks
    ssl.truststore.location=/etc/kafka/tls/ca.truststore.jks
    ssl.keystore.password=${KAFKA_SSL_KEYSTORE_PASSWORD}
    ssl.truststore.password=${KAFKA_SSL_TRUSTSTORE_PASSWORD}
    listener.name.client.sasl.enabled.mechanisms=PLAIN
    listener.name.client.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required;
    listener.name.internal.ssl.client.auth=required
    listener.name.controller.ssl.client.auth=required
    listener.security.protocol.map=CLIENT:SASL_SSL,INTERNAL:SSL,CONTROLLER:SSL
    inter.broker.listener.name=INTERNAL
    controller.listener.names=CONTROLLER
    log.dirs=/var/lib/kafka/data
    num.partitions=6
    log.retention.hours=168

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka
  labels: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: vnshop}
automountServiceAccountToken: false

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: vnshop
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
  - name: client
    port: 9092
    targetPort: client
  - name: controller
    port: 9093
    targetPort: controller
  - name: internal
    port: 9094
    targetPort: internal

---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: vnshop
spec:
  selector:
    app.kubernetes.io/name: kafka
  ports:
  - name: client
    port: 9092
    targetPort: client

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: vnshop
  annotations:
    vnshop.io/kafka-authority: production-kraft-v1
spec:
  replicas: 3
  serviceName: kafka-headless
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: vnshop
    spec:
      serviceAccountName: kafka
      automountServiceAccountToken: false
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: kafka
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: kafka
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: kafka-init
        image: confluentinc/cp-kafka@sha256:acbbf674f2ed40e5d0a8ca51beb0f00692c866fc22b5ce06f8cadbdc54cd4436
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-ec"]
        args:
        - |
          ordinal="${HOSTNAME##*-}"
          test "$ordinal" = 0 -o "$ordinal" = 1 -o "$ordinal" = 2
          if [ ! -f /var/lib/kafka/data/meta.properties ]; then
            kafka-storage format --config /etc/kafka/server.properties --cluster-id "$KAFKA_CLUSTER_ID" --ignore-formatted
          fi
        env:
        - name: KAFKA_CLUSTER_ID
          valueFrom:
            secretKeyRef: {name: vnshop-runtime-secrets, key: platform-kafka-cluster-id}
        - name: KAFKA_SSL_KEYSTORE_PASSWORD
          valueFrom:
            secretKeyRef: {name: vnshop-runtime-secrets, key: platform-kafka-broker-keystore-password}
        - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
          valueFrom:
            secretKeyRef: {name: vnshop-runtime-secrets, key: platform-kafka-truststore-password}
        volumeMounts:
        - {name: kafka-data, mountPath: /var/lib/kafka/data}
        - {name: kafka-config, mountPath: /etc/kafka/server.properties, subPath: server.properties, readOnly: true}
        - {name: kafka-tls, mountPath: /etc/kafka/tls, readOnly: true}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
      containers:
      - name: kafka
        image: confluentinc/cp-kafka@sha256:acbbf674f2ed40e5d0a8ca51beb0f00692c866fc22b5ce06f8cadbdc54cd4436
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-ec"]
        args:
        - |
          export KAFKA_NODE_ID="${HOSTNAME##*-}"
          test "$KAFKA_NODE_ID" = 0 -o "$KAFKA_NODE_ID" = 1 -o "$KAFKA_NODE_ID" = 2
          exec /etc/confluent/docker/run
        ports:
        - {name: client, containerPort: 9092}
        - {name: controller, containerPort: 9093}
        - {name: internal, containerPort: 9094}
        env:
        - {name: KAFKA_PROCESS_ROLES, value: broker,controller}
        - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: '0@kafka-0.kafka-headless:9093,1@kafka-1.kafka-headless:9093,2@kafka-2.kafka-headless:9093'}
        - {name: KAFKA_LISTENERS, value: 'CLIENT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:9094'}
        - {name: KAFKA_ADVERTISED_LISTENERS, value: 'CLIENT://kafka:9092,INTERNAL://$(POD_NAME).kafka-headless:9094'}
        - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: 'CLIENT:SASL_SSL,CONTROLLER:SSL,INTERNAL:SSL'}
        - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL}
        - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
        - {name: KAFKA_SASL_ENABLED_MECHANISMS, value: PLAIN}
        - {name: KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL, value: PLAIN}
        - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
        - {name: KAFKA_AUTHORIZER_CLASS_NAME, value: org.apache.kafka.metadata.authorizer.StandardAuthorizer}
        - {name: KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND, value: "false"}
        - {name: KAFKA_SUPER_USERS, value: 'User:kafka-controller;User:kafka-admin'}
        - {name: KAFKA_SSL_CLIENT_AUTH, value: required}
        - {name: KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM, value: HTTPS}
        - {name: KAFKA_SSL_KEYSTORE_TYPE, value: JKS}
        - {name: KAFKA_SSL_TRUSTSTORE_TYPE, value: JKS}
        - {name: KAFKA_SSL_KEYSTORE_FILENAME, value: broker.keystore.jks}
        - {name: KAFKA_SSL_TRUSTSTORE_FILENAME, value: ca.truststore.jks}
        - name: KAFKA_SSL_KEYSTORE_PASSWORD
          valueFrom: {secretKeyRef: {name: vnshop-runtime-secrets, key: platform-kafka-broker-keystore-password}}
        - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
          valueFrom: {secretKeyRef: {name: vnshop-runtime-secrets, key: platform-kafka-truststore-password}}
        - name: KAFKA_CLUSTER_ID
          valueFrom: {secretKeyRef: {name: vnshop-runtime-secrets, key: platform-kafka-cluster-id}}
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        volumeMounts:
        - {name: kafka-data, mountPath: /var/lib/kafka/data}
        - {name: kafka-config, mountPath: /etc/kafka/server.properties, subPath: server.properties, readOnly: true}
        - {name: kafka-tls, mountPath: /etc/kafka/tls, readOnly: true}
        readinessProbe:
          exec:
            command: ["/bin/bash", "-ec", "test -r /etc/kafka/tls/ca.truststore.jks && kafka-broker-api-versions --bootstrap-server kafka:9092 --command-config /etc/kafka/tls/admin.properties >/dev/null"]
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 8
          failureThreshold: 6
        livenessProbe:
          exec:
            command: ["/bin/bash", "-ec", "kafka-broker-api-versions --bootstrap-server kafka:9092 --command-config /etc/kafka/tls/admin.properties >/dev/null"]
          initialDelaySeconds: 90
          periodSeconds: 20
          timeoutSeconds: 8
          failureThreshold: 3
        startupProbe:
          exec:
            command: ["/bin/bash", "-ec", "kafka-broker-api-versions --bootstrap-server kafka:9092 --command-config /etc/kafka/tls/admin.properties >/dev/null"]
          periodSeconds: 10
          timeoutSeconds: 8
          failureThreshold: 30
        resources:
          requests: {cpu: 500m, memory: 1Gi}
          limits: {cpu: "2", memory: 2Gi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
      volumes:
      - {name: kafka-config, configMap: {name: kafka-config}}
      - name: kafka-tls
        secret:
          secretName: vnshop-runtime-secrets
          items:
          - {key: platform-kafka-broker-keystore, path: broker.keystore.jks}
          - {key: platform-kafka-truststore, path: ca.truststore.jks}
          - {key: platform-kafka-admin-client-properties, path: admin.properties}
  volumeClaimTemplates:
  - metadata:
      name: kafka-data
      labels: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: vnshop}
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: standard-rwo
      resources: {requests: {storage: 100Gi}}
