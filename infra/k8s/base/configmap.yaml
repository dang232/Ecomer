apiVersion: v1
kind: ConfigMap
metadata:
  name: vnshop-app-config
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
data:
  # Browser-facing origins. Deployments must override these with the public
  # ingress origins; never use Kubernetes service DNS names here.
  WEB_ORIGIN: https://web.vnshop.invalid
  API_ORIGIN: https://api.vnshop.invalid
  AUTH_ORIGIN: https://api.vnshop.invalid
  GATEWAY_CORS_ALLOWED_ORIGINS: https://web.vnshop.invalid
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
  KEYCLOAK_ISSUER_URI: https://api.vnshop.invalid/realms/vnshop
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/vnshop/protocol/openid-connect/certs
  KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
  KEYCLOAK_PUBLIC_BASE_URL: https://api.vnshop.invalid
  KEYCLOAK_ADMIN_ROLE: ADMIN
  CORS_ORIGINS: http://localhost:8080,http://localhost:8096
  CONFIG_SERVICE_URL: http://configuration-service:8097
  CONFIG_SERVICE_ENABLED: "true"
  PRODUCT_SERVICE_URL: http://product-service:8082
  PRODUCT_SERVICE_URI: http://product-service:8082
  USER_SERVICE_URL: http://user-service:8081
  USER_SERVICE_TIMEOUT_MS: "2000"
  VNSHOP_FRONTEND_URL: https://web.vnshop.invalid
  VNSHOP_PUBLIC_API_URL: https://api.vnshop.invalid
  VNSHOP_AUTH_CALLBACK_BASE_URL: https://api.vnshop.invalid/auth/oauth/callback
  # Public media URLs must resolve from a user's browser, not cluster-only DNS.
  # Environment overlays may replace this with the approved storage domain.
  VNSHOP_OBJECT_STORAGE_PUBLIC_ENDPOINT: https://storage.vnshop.invalid
  VNSHOP_USER_STORAGE_PUBLIC_ENDPOINT: https://storage.vnshop.invalid
  VNSHOP_OBJECT_STORAGE_REVIEW_BUCKET: vnshop-reviews
  GRPC_CLIENT_INVENTORY_HOST: inventory-service
  GRPC_CLIENT_INVENTORY_PORT: "9093"
  GRPC_CLIENT_PAYMENT_HOST: payment-service
  GRPC_CLIENT_PAYMENT_PORT: "9094"
  GRPC_CLIENT_SHIPPING_HOST: shipping-service
  GRPC_CLIENT_SHIPPING_PORT: "9095"
  MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: vnshop
  MONGODB_HOST: mongodb
  ELASTICSEARCH_URL: http://elasticsearch:9200
  ELASTICSEARCH_HOST: elasticsearch
  ELASTICSEARCH_PORT: "9200"
  MINIO_ENDPOINT: http://minio:9000
  MINIO_API_CORS_ALLOW_ORIGIN: https://web.vnshop.invalid
  TIMESCALE_HOST: timescaledb
  TIMESCALE_PORT: "5432"
  OPENAPI_ENABLED: "false"
  SWAGGER_ENABLED: "false"
  VNSHOP_AUTH_COOKIE_SECURE: "true"
  VNSHOP_AUTH_COOKIE_SAME_SITE: Strict
  CARRIER_MODE: stub
  COD_ENABLED: "true"
  VIETQR_ENABLED: "false"
  VIETQR_MODE: demo
  STRIPE_ENABLED: "false"
  PAYPAL_ENABLED: "false"
  VNPAY_ENABLED: "false"
  MOMO_ENABLED: "false"
  SEPAY_ENABLED: "false"
