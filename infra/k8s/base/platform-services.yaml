apiVersion: v1
kind: Service
metadata:
  name: redis
  annotations: {argocd.argoproj.io/sync-wave: "-15"}
spec:
  selector: {app.kubernetes.io/name: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  annotations: {argocd.argoproj.io/sync-wave: "-15"}
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: vnshop}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: redis
        image: redis@sha256:2cc044fc5a07c9b701f8f1255a309ae9ad7856e694ac03513bf3648c01e40763
        command: [sh, -ec, 'exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"']
        env:
        - name: REDIS_PASSWORD
          valueFrom: {secretKeyRef: {name: vnshop-runtime-secrets, key: platform-redis-password}}
        ports: [{name: redis, containerPort: 6379}]
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 5Gi}}
