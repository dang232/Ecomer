---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-rate-limit
  labels: {app.kubernetes.io/name: redis-rate-limit, app.kubernetes.io/part-of: vnshop}
  annotations: {argocd.argoproj.io/sync-wave: "-15", vnshop.io/redis-policy: noeviction}
spec:
  serviceName: redis-rate-limit-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector: {matchLabels: {app.kubernetes.io/name: redis-rate-limit}}
  template:
    metadata: {labels: {app.kubernetes.io/name: redis-rate-limit, app.kubernetes.io/part-of: vnshop}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: redis
          image: redis@sha256:2cc044fc5a07c9b701f8f1255a309ae9ad7856e694ac03513bf3648c01e40763
          command: [sh, -ec]
          args:
            - |
              ordinal="${HOSTNAME##*-}"
              replica_args=""
              if [ "$ordinal" != "0" ]; then replica_args="--replicaof redis-rate-limit-0.redis-rate-limit-headless 6379"; fi
              exec redis-server --appendonly yes --protected-mode yes --maxmemory 512mb --maxmemory-policy noeviction --requirepass "$REDIS_PASSWORD" --masterauth "$REDIS_PASSWORD" $replica_args
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: vnshop-runtime-secrets, key: platform-redis-password}}
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe: {exec: {command: [sh, -ec, 'redis-cli -a "$REDIS_PASSWORD" ping']}, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-rate-limit-sentinel
  labels: {app.kubernetes.io/name: redis-rate-limit-sentinel, app.kubernetes.io/part-of: vnshop}
spec:
  serviceName: redis-rate-limit-sentinel-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector: {matchLabels: {app.kubernetes.io/name: redis-rate-limit-sentinel}}
  template:
    metadata: {labels: {app.kubernetes.io/name: redis-rate-limit-sentinel, app.kubernetes.io/part-of: vnshop}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: sentinel
          image: redis@sha256:2cc044fc5a07c9b701f8f1255a309ae9ad7856e694ac03513bf3648c01e40763
          command: [sh, -ec]
          args:
            - |
              cat > /data/sentinel.conf <<EOF
              port 26379
              protected-mode no
              sentinel monitor redis-rate-limit redis-rate-limit-0.redis-rate-limit-headless 6379 2
              sentinel down-after-milliseconds redis-rate-limit 5000
              sentinel failover-timeout redis-rate-limit 60000
              sentinel parallel-syncs redis-rate-limit 1
              sentinel auth-pass redis-rate-limit $REDIS_PASSWORD
              EOF
              exec redis-server /data/sentinel.conf --sentinel
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: vnshop-runtime-secrets, key: platform-redis-password}}
          ports: [{name: sentinel, containerPort: 26379}]
          readinessProbe: {tcpSocket: {port: sentinel}, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
