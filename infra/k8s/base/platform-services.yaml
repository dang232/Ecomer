apiVersion: v1
kind: Service
metadata:
  name: kafka
  annotations: {argocd.argoproj.io/sync-wave: "-15"}
spec:
  selector: {app.kubernetes.io/name: kafka}
  ports: [{name: kafka, port: 9092, targetPort: kafka}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  annotations: {argocd.argoproj.io/sync-wave: "-15"}
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kafka}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: vnshop}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: kafka
        image: confluentinc/cp-kafka@sha256:acbbf674f2ed40e5d0a8ca51beb0f00692c866fc22b5ce06f8cadbdc54cd4436
        ports: [{name: kafka, containerPort: 9092}]
        env:
        - {name: KAFKA_NODE_ID, value: "1"}
        - {name: KAFKA_PROCESS_ROLES, value: broker,controller}
        - {name: KAFKA_LISTENERS, value: 'SASL_PLAINTEXT://:9092,CONTROLLER://:9093'}
        - {name: KAFKA_ADVERTISED_LISTENERS, value: 'SASL_PLAINTEXT://kafka:9092'}
        - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
        - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: 'CONTROLLER:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT'}
        - {name: KAFKA_SASL_ENABLED_MECHANISMS, value: PLAIN}
        - {name: KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL, value: PLAIN}
        - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: SASL_PLAINTEXT}
        - {name: KAFKA_AUTHORIZER_CLASS_NAME, value: org.apache.kafka.metadata.authorizer.StandardAuthorizer}
        - {name: KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND, value: "false"}
        - {name: KAFKA_SUPER_USERS, value: 'User:admin'}
        - {name: KAFKA_OPTS, value: '-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf'}
        - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: '1@kafka-0.kafka:9093'}
        - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
        - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
        - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
        - name: CLUSTER_ID
          valueFrom: {secretKeyRef: {name: vnshop-runtime-secrets, key: platform-kafka-cluster-id}}
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {cpu: "2", memory: 2Gi}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        volumeMounts:
        - {name: data, mountPath: /var/lib/kafka/data}
        - {name: kafka-jaas, mountPath: /etc/kafka/secrets/kafka_server_jaas.conf, subPath: kafka_server_jaas.conf, readOnly: true}
      volumes:
      - name: kafka-jaas
        secret:
          secretName: vnshop-runtime-secrets
          items: [{key: kafka-server-jaas, path: kafka_server_jaas.conf}]
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 30Gi}}
---
