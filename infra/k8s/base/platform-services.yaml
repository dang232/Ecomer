# VNShop production platform data plane.
#
# PostgreSQL is managed by the Zalando postgres-operator (Patroni), Redis is
# split into three independent Sentinel groups, MongoDB is a replica set, and
# MinIO uses distributed erasure coding. The operator installations and their
# RBAC are platform prerequisites and are deliberately not hidden in this
# application namespace manifest.
---
apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: vnshop
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
    vnshop.io/ha: patroni-postgres-operator
spec:
  teamId: vnshop
  postgresql:
    version: "17"
    parameters:
      synchronous_commit: "on"
      synchronous_standby_names: "ANY 1 (*)"
      wal_level: replica
      max_wal_senders: "10"
      max_replication_slots: "10"
  numberOfInstances: 3
  enableMasterLoadBalancer: false
  enableReplicaLoadBalancer: false
  volume:
    size: 40Gi
    storageClass: fast-ssd
  users:
    vnshop:
      - superuser
      - createdb
  databases:
    vnshop: vnshop
  allowedSourceRanges: []
  patroni:
    pg_hba:
      - local all all trust
      - host all all 0.0.0.0/0 scram-sha-256
      - host replication standby 0.0.0.0/0 scram-sha-256
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: vnshop
  annotations:
    argocd.argoproj.io/sync-wave: "-19"
    vnshop.io/ha-role: primary
spec:
  type: ClusterIP
  selector:
    application: spilo
    cluster-name: postgres
    spilo-role: master
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-repl
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: vnshop
  annotations:
    argocd.argoproj.io/sync-wave: "-19"
    vnshop.io/ha-role: replica
spec:
  type: ClusterIP
  selector:
    application: spilo
    cluster-name: postgres
    spilo-role: replica
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
  annotations: {argocd.argoproj.io/sync-wave: "-15"}
spec:
  selector: {app.kubernetes.io/name: timescaledb}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb
  annotations: {argocd.argoproj.io/sync-wave: "-15"}
spec:
  serviceName: timescaledb
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: timescaledb}
  template:
    metadata:
      labels: {app.kubernetes.io/name: timescaledb, app.kubernetes.io/part-of: vnshop}
    spec:
      securityContext: {runAsNonRoot: true, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: timescaledb
          image: timescale/timescaledb@sha256:61f891691050da6032023c01ea885730eeeba06b7c17b403e7d0b9c49c37dfe9
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: monitoring}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: vnshop-runtime-secrets, key: platform-timescale-username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: vnshop-runtime-secrets, key: platform-timescale-password}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 20Gi}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-ha-contract
  labels: {app.kubernetes.io/part-of: vnshop}
data:
  REDIS_RATE_LIMIT_SENTINEL_MASTER: redis-rate-limit
  REDIS_RATE_LIMIT_SENTINEL_NODES: redis-rate-limit-sentinel-0.redis-rate-limit-sentinel-headless:26379,redis-rate-limit-sentinel-1.redis-rate-limit-sentinel-headless:26379,redis-rate-limit-sentinel-2.redis-rate-limit-sentinel-headless:26379
  REDIS_CART_SENTINEL_MASTER: redis-cart
  REDIS_CART_SENTINEL_NODES: redis-cart-sentinel-0.redis-cart-sentinel-headless:26379,redis-cart-sentinel-1.redis-cart-sentinel-headless:26379,redis-cart-sentinel-2.redis-cart-sentinel-headless:26379
  REDIS_DEDUP_SENTINEL_MASTER: redis-dedup
  REDIS_DEDUP_SENTINEL_NODES: redis-dedup-sentinel-0.redis-dedup-sentinel-headless:26379,redis-dedup-sentinel-1.redis-dedup-sentinel-headless:26379,redis-dedup-sentinel-2.redis-dedup-sentinel-headless:26379
  REDIS_CART_DEFAULT_TTL_SECONDS: "2592000"
  REDIS_DEDUP_DEFAULT_TTL_SECONDS: "86400"
---
# The compatibility service is only a DNS alias for the rate-limit group. New
# workloads must use one of the three explicit Sentinel contracts above.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: vnshop}
  annotations: {vnshop.io/deprecated: use-workload-specific-sentinel-service}
spec:
  type: ExternalName
  externalName: redis-rate-limit-sentinel
  ports: [{name: sentinel, port: 26379}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis-rate-limit-headless
