metadata:
  name: minio
  annotations: {argocd.argoproj.io/sync-wave: "-15", vnshop.io/erasure-coding: "4+2"}
spec:
  serviceName: minio-headless
  replicas: 4
  podManagementPolicy: Parallel
  selector: {matchLabels: {app.kubernetes.io/name: minio}}
  template:
    metadata: {labels: {app.kubernetes.io/name: minio, app.kubernetes.io/part-of: vnshop}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: minio
          image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          args: [server, 'http://minio-{0...3}.minio-headless/data{1...2}', --console-address, ':9001']
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: vnshop-runtime-secrets, key: platform-minio-root-user}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: vnshop-runtime-secrets, key: platform-minio-root-password}}
            - {name: MINIO_STORAGE_CLASS_STANDARD, value: EC:2}
            - name: MINIO_API_CORS_ALLOW_ORIGIN
              valueFrom: {configMapKeyRef: {name: vnshop-app-config, key: MINIO_API_CORS_ALLOW_ORIGIN}}
          ports:
            - {name: api, containerPort: 9000}
            - {name: console, containerPort: 9001}
          readinessProbe: {httpGet: {path: /minio/health/ready, port: api}, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data-1, mountPath: /data1}
            - {name: data-2, mountPath: /data2}
  volumeClaimTemplates:
    - metadata: {name: data-1}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 20Gi}}}
    - metadata: {name: data-2}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 20Gi}}}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  annotations: {argocd.argoproj.io/sync-wave: "-15"}
spec:
  selector: {app.kubernetes.io/name: keycloak}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  annotations: {argocd.argoproj.io/sync-wave: "-15", vnshop.io/ha: "2"}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: keycloak}}
  template:
    metadata: {labels: {app.kubernetes.io/name: keycloak, app.kubernetes.io/part-of: vnshop}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app.kubernetes.io/name: keycloak}}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak@sha256:0aae0de7fca85525f727d3354df17896092de8bb26ae4c12d89c77e5df8cbce4
          args: [start, --http-enabled=true, --proxy-headers=xforwarded]
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: 'jdbc:postgresql://postgres:5432/vnshop'}
            - {name: KC_DB_SCHEMA, value: keycloak}
            - {name: KC_CACHE, value: ispn}
            - {name: KC_CACHE_STACK, value: kubernetes}
            - name: KC_HOSTNAME
              valueFrom: {configMapKeyRef: {name: vnshop-app-config, key: AUTH_ORIGIN}}
            - name: KC_DB_USERNAME
              valueFrom: {secretKeyRef: {name: vnshop-runtime-secrets, key: keycloak-db-username}}
            - name: KC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: vnshop-runtime-secrets, key: keycloak-db-password}}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: {secretKeyRef: {name: vnshop-runtime-secrets, key: keycloak-admin-username}}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: vnshop-runtime-secrets, key: keycloak-admin-password}}
          readinessProbe: {httpGet: {path: /realms/master, port: http}, periodSeconds: 10, failureThreshold: 12}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
