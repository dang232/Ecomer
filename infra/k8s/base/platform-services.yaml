apiVersion: v1
kind: Service
metadata:
  name: postgres
  annotations: {argocd.argoproj.io/sync-wave: "-15"}
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  annotations: {argocd.argoproj.io/sync-wave: "-15"}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: vnshop}
    spec:
      securityContext: {runAsNonRoot: true, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: postgres
        image: postgres@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
        ports: [{name: postgres, containerPort: 5432}]
        env:
        - {name: POSTGRES_DB, value: vnshop}
        - name: POSTGRES_USER
          valueFrom: {secretKeyRef: {name: vnshop-runtime-secrets, key: platform-postgres-admin-username}}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: vnshop-runtime-secrets, key: platform-postgres-admin-password}}
        readinessProbe: {exec: {command: [sh, -ec, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}, periodSeconds: 10}
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {cpu: "2", memory: 2Gi}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 40Gi}}
---
