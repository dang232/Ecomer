# OpenTelemetry Trace Sampling Configuration
#
# OTEL_TRACES_SAMPLER_ARG is overridden per environment in each overlay's
# configmap-env.yaml:
#   dev:     1.0  (100%)
#   staging: 0.1  (10%)
#   prod:    0.01 (1%, collector tail sampling: errors always-on)
#
# Error traces are always sampled via the tail-based sampling processor
# configured in the OTEL collector (see otel-collector.yaml if present, or
# the Jaeger all-in-one sampling strategies below).
#
# Sampler type is set in the base configmap:
#   OTEL_TRACES_SAMPLER=parentbased_traceidratio
# which means root spans are sampled at the configured ratio and child spans
# respect the parent's sampling decision.
# OTEL Collector ConfigMap with tail-based sampling processor.
# Error spans (status_code = STATUS_CODE_ERROR) are always sampled regardless
# of the head-based ratio configured above.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app.kubernetes.io/part-of: vnshop
    app.kubernetes.io/component: observability
data:
  otel-collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # Tail-based sampler: always keep error traces; sample the rest at 1%.
      tail_sampling:
        decision_wait: 10s
        num_traces: 100000
        expected_new_traces_per_sec: 1000
        policies:
          - name: errors-always-on
            type: status_code
            status_code:
              status_codes: [ERROR]
          - name: base-ratio
            type: probabilistic
            probabilistic:
              sampling_percentage: 1

      batch:
        send_batch_size: 1024
        timeout: 5s

      memory_limiter:
        check_interval: 1s
        limit_mib: 512

    exporters:
      otlp/jaeger:
        endpoint: jaeger-collector:4317
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, tail_sampling, batch]
          exporters: [otlp/jaeger]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: vnshop
    app.kubernetes.io/component: observability
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: vnshop
        app.kubernetes.io/component: observability
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib@sha256:6b9dfd9c78dc08136b3adc808d31d57ee96cc4a26d1a147171e15c14b6498403
        imagePullPolicy: IfNotPresent
        args: [--config=/conf/otel-collector.yaml]
        ports:
        - name: otlp-grpc
          containerPort: 4317
        - name: otlp-http
          containerPort: 4318
        readinessProbe:
          tcpSocket:
            port: otlp-http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: config
          mountPath: /conf
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: vnshop
    app.kubernetes.io/component: observability
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: otlp-grpc
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
