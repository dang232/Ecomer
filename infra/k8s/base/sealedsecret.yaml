apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: vnshop-runtime-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
    sealedsecrets.bitnami.com/cluster-wide: "true"
    vnshop.io/sealing-status: required-before-promotion
spec:
  # Provision payment-grpc-service-token externally before promotion. The
  # encrypted value is intentionally omitted from source control.
  encryptedData: {}
  template:
    metadata:
      name: vnshop-runtime-secrets
    type: Opaque
