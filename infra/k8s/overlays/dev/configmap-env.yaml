apiVersion: v1
kind: ConfigMap
metadata:
  name: vnshop-app-config
data:
  SPRING_PROFILES_ACTIVE: dev
  NODE_ENV: development
  OTEL_TRACES_SAMPLER_ARG: "1.0"
  WEB_ORIGIN: http://localhost:3000
  API_ORIGIN: http://localhost:8080
  AUTH_ORIGIN: http://localhost:8080
  KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/vnshop
  KEYCLOAK_PUBLIC_BASE_URL: http://localhost:8080
  KEYCLOAK_ADMIN_ROLE: ADMIN
  CORS_ORIGINS: http://localhost:8080,http://localhost:8096
  GATEWAY_CORS_ALLOWED_ORIGINS: http://localhost:3000
  VNSHOP_FRONTEND_URL: http://localhost:3000
  VNSHOP_PUBLIC_API_URL: http://localhost:8080
  VNSHOP_AUTH_CALLBACK_BASE_URL: http://localhost:8080/auth/oauth/callback
