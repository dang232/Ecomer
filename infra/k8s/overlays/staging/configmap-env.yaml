  KEYCLOAK_ADMIN_ROLE: ADMIN
  VNSHOP_RATE_LIMIT_TRUSTED_PROXY_CIDRS: "10.0.0.0/8"
  CORS_ORIGINS: https://web.vnshop.invalid,https://api.vnshop.invalid
  GATEWAY_CORS_ALLOWED_ORIGINS: https://web.vnshop.invalid
  VNSHOP_FRONTEND_URL: https://web.vnshop.invalid
  VNSHOP_PUBLIC_API_URL: https://api.vnshop.invalid
  VNSHOP_AUTH_CALLBACK_BASE_URL: https://api.vnshop.invalid/auth/oauth/callback
  VNSHOP_OBJECT_STORAGE_PUBLIC_ENDPOINT: https://storage.vnshop.invalid
  VNSHOP_USER_STORAGE_PUBLIC_ENDPOINT: https://storage.vnshop.invalid
  MINIO_API_CORS_ALLOW_ORIGIN: https://web.vnshop.invalid
