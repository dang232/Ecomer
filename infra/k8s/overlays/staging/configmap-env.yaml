apiVersion: v1
kind: ConfigMap
metadata:
  name: vnshop-app-config
data:
  SPRING_PROFILES_ACTIVE: staging
  NODE_ENV: production
  OTEL_TRACES_SAMPLER_ARG: "0.1"
  WEB_ORIGIN: https://web.vnshop.invalid
  API_ORIGIN: https://api.vnshop.invalid
  AUTH_ORIGIN: https://api.vnshop.invalid
  KEYCLOAK_ISSUER_URI: https://api.vnshop.invalid/realms/vnshop
