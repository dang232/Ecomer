apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vnshop
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    cert-manager.io/cluster-issuer: vnshop-ci-root
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts: [web.vnshop.invalid, api.vnshop.invalid, auth.vnshop.invalid, storage.vnshop.invalid]
    secretName: vnshop-tls
  rules:
  - host: web.vnshop.invalid
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 8080
  - host: api.vnshop.invalid
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8080
  - host: auth.vnshop.invalid
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
  - host: storage.vnshop.invalid
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: minio
            port:
              number: 9000
