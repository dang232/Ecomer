schema_version: kafka-topic-inventory.v1
authority: infra/kafka/topic-inventory.yaml
bootstrap:
  dns: kafka:9092
  listener: CLIENT
  protocol: SASL_SSL
  sasl_mechanism: PLAIN
  hostname_verification: HTTPS
  ca_secret_key: platform-kafka-truststore
  client_certificate_secret_key: platform-kafka-admin-keystore
  admin_principal: kafka-admin
  admin_password_secret_key: platform-kafka-admin-password
  auto_topic_creation: false
topics:
  - {name: messaging.message.sent, partitions: 1, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: product-events, partitions: 12, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: order.created, partitions: 6, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: order.updated, partitions: 6, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: order.paid, partitions: 6, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: order.shipped, partitions: 6, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: order.cancelled, partitions: 6, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: payment.completed, partitions: 6, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: payment.refund.requested, partitions: 6, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: payment.refunded, partitions: 6, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: inventory.released, partitions: 6, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: shipping.cancelled, partitions: 6, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: shipping.cancel-requested, partitions: 6, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: shipping.status.updated, partitions: 6, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: order.confirmed, partitions: 6, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: order.confirmed.retry, partitions: 6, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: order.confirmed.DLT, partitions: 6, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: order.delivered, partitions: 6, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: notification.events, partitions: 6, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: product.approved, partitions: 3, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: product.rejected, partitions: 3, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: review.replied, partitions: 3, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: return.requested, partitions: 3, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: payout.completed, partitions: 3, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: user.registered, partitions: 3, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: user.password-reset, partitions: 3, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: video.upload.completed, partitions: 3, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: video.transcode.completed, partitions: 3, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: video.transcode.failed, partitions: 3, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: video.moderation.completed, partitions: 3, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: video.published, partitions: 3, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: video.rejected, partitions: 3, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: video.moderation.dlt, partitions: 3, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: video.upload.completed.DLT, partitions: 3, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: video.transcode.completed.DLT, partitions: 3, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: gdpr.export-requested, partitions: 1, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: gdpr.export-fragment, partitions: 3, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: gdpr.deletion-requested, partitions: 1, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
  - {name: gdpr.deletion-completed, partitions: 3, replication_factor: 3, min_insync_replicas: 2, config_version: v1}
clients:
  - {service: order-service, principal: svc-order, bootstrap: kafka:9092, protocol: SASL_SSL, mechanism: PLAIN, ca_secret: order-service-kafka-ca, client_cert_secret: order-service-kafka-client-cert, client_key_secret: order-service-kafka-client-key, username_secret: order-service-kafka-username, password_secret: order-service-kafka-password, hostname_verification: HTTPS, groups: [order-service-payment, order-service-refund, order-service-projection, order-service-finance, order-service-saga-compensation, order-service-gdpr], fallback: fail-closed}
  - {service: payment-service, principal: svc-payment, bootstrap: kafka:9092, protocol: SASL_SSL, mechanism: PLAIN, ca_secret: payment-service-kafka-ca, client_cert_secret: payment-service-kafka-client-cert, client_key_secret: payment-service-kafka-client-key, username_secret: payment-service-kafka-username, password_secret: payment-service-kafka-password, hostname_verification: HTTPS, groups: [payment-service-paypal-refund, payment-service-gdpr], fallback: fail-closed}
  - {service: inventory-service, principal: svc-inventory, bootstrap: kafka:9092, protocol: SASL_SSL, mechanism: PLAIN, ca_secret: inventory-service-kafka-ca, client_cert_secret: inventory-service-kafka-client-cert, client_key_secret: inventory-service-kafka-client-key, username_secret: inventory-service-kafka-username, password_secret: inventory-service-kafka-password, hostname_verification: HTTPS, groups: [inventory-service-gdpr], fallback: fail-closed}
  - {service: product-service, principal: svc-product, bootstrap: kafka:9092, protocol: SASL_SSL, mechanism: PLAIN, ca_secret: product-service-kafka-ca, client_cert_secret: product-service-kafka-client-cert, client_key_secret: product-service-kafka-client-key, username_secret: product-service-kafka-username, password_secret: product-service-kafka-password, hostname_verification: HTTPS, groups: [product-service-review-purchases, product-service-video-transcode-failures], fallback: fail-closed}
  - {service: shipping-service, principal: svc-shipping, bootstrap: kafka:9092, protocol: SASL_SSL, mechanism: PLAIN, ca_secret: shipping-service-kafka-ca, client_cert_secret: shipping-service-kafka-client-cert, client_key_secret: shipping-service-kafka-client-key, username_secret: shipping-service-kafka-username, password_secret: shipping-service-kafka-password, hostname_verification: HTTPS, groups: [shipping-svc-cancel, shipping-service-gdpr], fallback: fail-closed}
  - {service: search-service, principal: svc-search, bootstrap: kafka:9092, protocol: SASL_SSL, mechanism: PLAIN, ca_secret: search-service-kafka-ca, client_cert_secret: search-service-kafka-client-cert, client_key_secret: search-service-kafka-client-key, username_secret: search-service-kafka-username, password_secret: search-service-kafka-password, hostname_verification: HTTPS, groups: [search-service], fallback: fail-closed}
  - {service: recommendations-service, principal: svc-recommendations, bootstrap: kafka:9092, protocol: SASL_SSL, mechanism: PLAIN, ca_secret: recommendations-service-kafka-ca, client_cert_secret: recommendations-service-kafka-client-cert, client_key_secret: recommendations-service-kafka-client-key, username_secret: recommendations-service-kafka-username, password_secret: recommendations-service-kafka-password, hostname_verification: HTTPS, groups: [recommendations-service], fallback: fail-closed}
  - {service: seller-finance-service, principal: svc-finance, bootstrap: kafka:9092, protocol: SASL_SSL, mechanism: PLAIN, ca_secret: seller-finance-service-kafka-ca, client_cert_secret: seller-finance-service-kafka-client-cert, client_key_secret: seller-finance-service-kafka-client-key, username_secret: seller-finance-service-kafka-username, password_secret: seller-finance-service-kafka-password, hostname_verification: HTTPS, groups: [seller-finance-service, seller-finance-service-refund], fallback: fail-closed}
  - {service: notification-service, principal: svc-notification, bootstrap: kafka:9092, protocol: SASL_SSL, mechanism: PLAIN, ca_secret: notification-service-kafka-ca, client_cert_secret: notification-service-kafka-client-cert, client_key_secret: notification-service-kafka-client-key, username_secret: notification-service-kafka-username, password_secret: notification-service-kafka-password, hostname_verification: HTTPS, groups: [notification-service-server], fallback: fail-closed}
  - {service: messaging-service, principal: svc-messaging, bootstrap: kafka:9092, protocol: SASL_SSL, mechanism: PLAIN, ca_secret: messaging-service-kafka-ca, client_cert_secret: messaging-service-kafka-client-cert, client_key_secret: messaging-service-kafka-client-key, username_secret: messaging-service-kafka-username, password_secret: messaging-service-kafka-password, hostname_verification: HTTPS, groups: [messaging-service], fallback: fail-closed}
  - {service: invoice-service, principal: svc-invoice, bootstrap: kafka:9092, protocol: SASL_SSL, mechanism: PLAIN, ca_secret: invoice-service-kafka-ca, client_cert_secret: invoice-service-kafka-client-cert, client_key_secret: invoice-service-kafka-client-key, username_secret: invoice-service-kafka-username, password_secret: invoice-service-kafka-password, hostname_verification: HTTPS, groups: [invoice-service], fallback: fail-closed}
  - {service: user-service, principal: svc-user, bootstrap: kafka:9092, protocol: SASL_SSL, mechanism: PLAIN, ca_secret: user-service-kafka-ca, client_cert_secret: user-service-kafka-client-cert, client_key_secret: user-service-kafka-client-key, username_secret: user-service-kafka-username, password_secret: user-service-kafka-password, hostname_verification: HTTPS, groups: [user-service-gdpr-export], fallback: fail-closed}
  - {service: video-transcoder, principal: svc-video-transcoder, bootstrap: kafka:9092, protocol: SASL_SSL, mechanism: PLAIN, ca_secret: video-transcoder-kafka-ca, client_cert_secret: video-transcoder-kafka-client-cert, client_key_secret: video-transcoder-kafka-client-key, username_secret: video-transcoder-kafka-username, password_secret: video-transcoder-kafka-password, hostname_verification: HTTPS, groups: [transcoder-worker], fallback: fail-closed}
  - {service: video-moderator, principal: svc-video-moderator, bootstrap: kafka:9092, protocol: SASL_SSL, mechanism: PLAIN, ca_secret: video-moderator-kafka-ca, client_cert_secret: video-moderator-kafka-client-cert, client_key_secret: video-moderator-kafka-client-key, username_secret: video-moderator-kafka-username, password_secret: video-moderator-kafka-password, hostname_verification: HTTPS, groups: [moderator-worker], fallback: fail-closed}
  - {service: kafka-admin-bootstrap, principal: kafka-admin, bootstrap: kafka:9092, protocol: SASL_SSL, mechanism: PLAIN, ca_secret: platform-kafka-truststore, client_cert_secret: platform-kafka-admin-keystore, client_key_secret: platform-kafka-admin-keystore-password, username_secret: platform-kafka-admin-username, password_secret: platform-kafka-admin-password, hostname_verification: HTTPS, groups: [], fallback: refuse-production-on-missing-secret}
acl_contract:
  application_super_users_forbidden: [svc-order, svc-payment, svc-inventory, svc-product, svc-shipping, svc-finance, svc-search, svc-recommendations, svc-invoice, svc-messaging, svc-user, svc-video-transcoder, svc-video-moderator]
  unauthorized_acl_probe: {principal: svc-unauthorized, topic: product-events, operation: Read, expected: DENIED}
  bootstrap_order: reassignment-verified-before-acl-bootstrap
  transactional_id_policy: service-principal-prefixed-and-explicit
  topic_acl_source: infra/k8s/base/kafka-bootstrap-job.yaml
  local_bootstrap_source: infra/scripts/init-kafka-topics.sh
