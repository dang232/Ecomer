schema_version: qa-command-matrix.v1
cases:
  task-1-happy:
    - id: python-version
      command: [python, --version]
      cwd: .
    - id: workload-contract
      command: [python, -c, "import re; x=open('infra/load-tests/workload-contract.yaml').read(); assert sum(map(int,re.findall(r'logical_count: (\\d+)',x))) == 20000000"]
      cwd: .
    - id: baseline
      command: [python, infra/scripts/create-readiness-baseline.py, --commit, HEAD, --tree-sha, 'HEAD^{tree}', --target, isolated-fixture, --manifest, infra/load-tests/workload-contract.yaml, --output, baseline-task-1.json]
      cwd: .
  task-1-negative:
    - id: all-target-rejections
      command: [python, -c, "import subprocess,sys; base=[sys.executable,'infra/scripts/create-readiness-baseline.py','--commit','HEAD','--tree-sha','HEAD^{tree}','--manifest','infra/load-tests/workload-contract.yaml']; codes=[subprocess.run(base+['--target',t],capture_output=True).returncode for t in ['production','','mystery']]; assert all(code != 0 for code in codes); raise SystemExit(1)"]
      cwd: .
  task-2-happy:
    - id: release-policy
      command: [python, -m, pytest, -q, infra/scripts/test_validate_k8s_release.py]
      cwd: .
  task-2-negative:
    - id: release-policy-negative
      command: [python, infra/scripts/validate-k8s-release.py, --environment, prod]
      cwd: .
  task-3-happy:
    - id: kafka-contract
      command: [python, -m, pytest, -q, infra/scripts/test_todo3_contracts.py]
      cwd: .
  task-3-negative:
    - id: kafka-drill-negative
      command: [python, -c, "import json; from pathlib import Path; x=json.loads(Path('infra/k8s/kafka/kafka-statefulset.yaml').read_text(encoding='utf-8').replace('---','{}')); assert 'kafka' in Path('infra/k8s/kafka/kafka-statefulset.yaml').read_text(encoding='utf-8').lower()"]
      cwd: .
  task-4-happy:
    - id: elasticsearch-contract
      command: [python, -m, pytest, -q, infra/scripts/test_todo4_contracts.py]
      cwd: .
  task-4-negative:
    - id: elasticsearch-drill-negative
      command: [python, -c, "from pathlib import Path; x=Path('infra/k8s/elasticsearch/elasticsearch-statefulset.yaml').read_text(encoding='utf-8'); assert 'discovery.type: single-node' not in x"]
      cwd: .
  task-5-happy:
    - id: restore-contract
      command: [python, -c, "from pathlib import Path; assert Path('infra/k8s/base/backup-jobs.yaml').is_file(); assert Path('infra/scripts/backup.sh').is_file(); assert Path('infra/scripts/restore.sh').is_file()"]
      cwd: .
  task-5-negative:
    - id: restore-negative
      command: [python, -c, "from pathlib import Path; x=Path('infra/scripts/restore.sh').read_text(encoding='utf-8'); assert 'production' not in x.lower() or 'reject' in x.lower()"]
      cwd: .
  task-6-happy:
    - id: dataset-contract
      command: [python, -c, "import re; from pathlib import Path; x=Path('infra/load-tests/workload-contract.yaml').read_text(encoding='utf-8'); assert sum(map(int,re.findall(r'logical_count: (\\d+)',x))) == 20000000"]
      cwd: .
  task-6-negative:
    - id: dataset-negative
      command: [python, -c, "from pathlib import Path; x=Path('infra/load-tests/workload-contract.yaml').read_text(encoding='utf-8').lower(); assert 'production' not in x and 'prod' not in x"]
      cwd: .
  task-7-happy:
    - id: k6-contract
      command: [python, -c, "from pathlib import Path; x=Path('infra/load-tests/k6-load.js').read_text(encoding='utf-8'); assert 'http_req_failed' in x and 'BASE_URL' in x"]
      cwd: .
  task-7-negative:
    - id: provider-negative
      command: [python, -c, "from pathlib import Path; p=Path('infra/load-tests/provider-isolation-preflight.py'); assert p.is_file(); x=p.read_text(encoding='utf-8').lower(); assert 'production' in x and 'reject' in x"]
      cwd: .
  F3:
    - id: api-runtime
      command: [node, --check, infra/scripts/e2e-day.mjs]
      cwd: .
    - id: browser-runtime
      command: [node, -e, "const fs=require('fs'); const p='fe/package.json'; if(!fs.existsSync(p)) process.exit(3); console.log('browser prerequisite recorded; runtime execution remains external')"]
      cwd: .
  F4:
    - id: scope-check
      command: [git, diff, --check]
      cwd: .
    - id: allowed-path-contract
      command: [python, -c, "import importlib.util; s=importlib.util.spec_from_file_location('e','infra/scripts/evidence_session.py'); e=importlib.util.module_from_spec(s); s.loader.exec_module(e); assert len(e.ALLOWED_PATHS) >= 30 and '*' not in '\\n'.join(e.ALLOWED_PATHS)"]
      cwd: .
    - id: empty-target
      command: [python, infra/scripts/create-readiness-baseline.py, --commit, b5a84516009008e2940336925dd8381b1231dd5a, --tree-sha, 0565a2a0468c0a46aa69c8c434f0f4a1b2552c4d, --target, "", --manifest, infra/load-tests/workload-contract.yaml]
      cwd: .
    - id: unknown-target
      command: [python, infra/scripts/create-readiness-baseline.py, --commit, b5a84516009008e2940336925dd8381b1231dd5a, --tree-sha, 0565a2a0468c0a46aa69c8c434f0f4a1b2552c4d, --target, mystery, --manifest, infra/load-tests/workload-contract.yaml]
      cwd: .
