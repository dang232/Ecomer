name: FE Linters (i18n + design tokens)

# i18n key parity (en/vi) and design-token usage are enforced by lightweight
# node scripts; they have no runtime deps so they run before npm ci.
# Failures here block PRs from regressing on the audits that surfaced 955→961
# keys and 285→0 design-token violations over the WS-1 / WS-6 sweeps.

on:
  push:
    branches: [main]
    paths:
      - 'fe/**'
      - '.github/workflows/lint-fe.yml'
  pull_request:
    branches: [main]
    paths:
      - 'fe/**'
      - '.github/workflows/lint-fe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n:
    name: i18n key parity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run i18n key linter
        run: node scripts/check-i18n-keys.mjs

  design-tokens:
    name: design-token usage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run design-token linter
        run: node scripts/check-design-tokens.mjs
