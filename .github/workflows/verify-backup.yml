name: Verify Backup

on:
  schedule:
    # Weekly: Sunday at 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-verification
  cancel-in-progress: false

jobs:
  verify-backup:
    name: Backup Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'vnshop' }}
      # Compose interpolates the entire stack, although this job starts only Postgres.
      # These are non-production placeholders used only to validate that configuration.
      ELASTIC_PASSWORD: ci-compose-placeholder
      KAFKA_ADMIN_PASSWORD: ci-compose-placeholder
      KAFKA_ORDER_PASSWORD: ci-compose-placeholder
      KAFKA_PAYMENT_PASSWORD: ci-compose-placeholder
      KAFKA_INVENTORY_PASSWORD: ci-compose-placeholder
      KAFKA_PRODUCT_PASSWORD: ci-compose-placeholder
      KAFKA_SHIPPING_PASSWORD: ci-compose-placeholder
      KAFKA_FINANCE_PASSWORD: ci-compose-placeholder
      KAFKA_SEARCH_PASSWORD: ci-compose-placeholder
      KAFKA_RECOMMENDATIONS_PASSWORD: ci-compose-placeholder
      KAFKA_INVOICE_PASSWORD: ci-compose-placeholder
      KAFKA_VIDEO_TRANSCODER_PASSWORD: ci-compose-placeholder
      KAFKA_VIDEO_MODERATOR_PASSWORD: ci-compose-placeholder

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Start core database services
        run: docker compose --profile apps up -d postgres-user postgres-order postgres-product

      - name: Wait for databases to be healthy
        run: |
          for svc in vnshop-postgres-user vnshop-postgres-order vnshop-postgres-product; do
            echo "Waiting for $svc..."
            for i in $(seq 1 30); do
              if docker inspect --format '{{.State.Health.Status}}' "$svc" 2>/dev/null | grep -q healthy; then
                echo "$svc is healthy"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "ERROR: $svc did not become healthy within 30 attempts"
                exit 1
              fi
              sleep 5
            done
          done

      - name: Seed backup verification fixtures
        run: |
          seed() {
            local container="$1"
            local database="$2"
            local schema="$3"
            local table="$4"

            docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" "$container" \
              psql -v ON_ERROR_STOP=1 -U vnshop -d "$database" \
              -c "CREATE SCHEMA IF NOT EXISTS \"$schema\"; CREATE TABLE IF NOT EXISTS \"$schema\".\"$table\" (id integer PRIMARY KEY); INSERT INTO \"$schema\".\"$table\" (id) VALUES (1) ON CONFLICT (id) DO NOTHING;"
          }

          seed vnshop-postgres-user vnshop_user user_svc users
          seed vnshop-postgres-order vnshop_order order_svc orders
          seed vnshop-postgres-product vnshop_product product_svc products

      - name: Run backup verification
        run: bash scripts/verify-backup.sh

      - name: Stop services
        if: always()
        run: docker compose --profile apps down -v
