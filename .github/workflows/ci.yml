name: VNShop CI

on:
  push:
    branches: [main, production, "release/**"]
  pull_request:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "25"
  PYTHON_VERSION: "3.11"
  FLUTTER_VERSION: "3.44.5"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      java_services: ${{ steps.matrix.outputs.java_services }}
      node_services: ${{ steps.matrix.outputs.node_services }}
      python_services: ${{ steps.matrix.outputs.python_services }}
      services: ${{ steps.matrix.outputs.services }}
      frontend: ${{ steps.matrix.outputs.frontend }}
      mobile: ${{ steps.matrix.outputs.mobile }}
      proto: ${{ steps.matrix.outputs.proto }}
      container_policy: ${{ steps.matrix.outputs.container_policy }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - name: Detect Java services
        id: java
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            api-gateway:
              - 'services/api-gateway/**'
              - '.github/workflows/ci.yml'
            inventory-service:
              - 'services/inventory-service/**'
              - '.github/workflows/ci.yml'
            invoice-service:
              - 'services/invoice-service/**'
              - '.github/workflows/ci.yml'
            order-service:
              - 'services/order-service/**'
              - '.github/workflows/ci.yml'
            payment-service:
              - 'services/payment-service/**'
              - 'infra/kafka/contracts/**'
              - '.github/workflows/ci.yml'
            product-service:
              - 'services/product-service/**'
              - '.github/workflows/ci.yml'
            recommendations-service:
              - 'services/recommendations-service/**'
              - '.github/workflows/ci.yml'
            search-service:
              - 'services/search-service/**'
              - '.github/workflows/ci.yml'
            seller-finance-service:
              - 'services/seller-finance-service/**'
              - 'infra/kafka/contracts/**'
              - '.github/workflows/ci.yml'
            shipping-service:
              - 'services/shipping-service/**'
              - '.github/workflows/ci.yml'
            user-service:
              - 'services/user-service/**'
              - '.github/workflows/ci.yml'
            video-transcoder:
              - 'services/video-transcoder/**'
              - '.github/workflows/ci.yml'

      - name: Detect Node services
        id: node
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            cart-service:
              - 'services/cart-service/**'
              - '.github/workflows/ci.yml'
            configuration-service:
              - 'services/configuration-service/**'
              - '.github/workflows/ci.yml'
            messaging-service:
              - 'services/messaging-service/**'
              - '.github/workflows/ci.yml'
            monitoring-service-v2:
              - 'services/monitoring-service-v2/**'
              - '.github/workflows/ci.yml'
            notification-service:
              - 'services/notification-service/**'
              - '.github/workflows/ci.yml'

      - name: Detect Python services
        id: python
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            video-moderator:
              - 'services/video-moderator/**'
              - '.github/workflows/ci.yml'

      - name: Detect application surfaces
        id: surfaces
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            frontend:
              - 'fe/**'
              - 'design-system/**'
              - 'scripts/generate-design-tokens.mjs'
              - 'scripts/generate-design-tokens.test.mjs'
              - '.github/workflows/ci.yml'
            mobile:
              - 'vnshop_mobile/**'
              - 'design-system/**'
              - 'scripts/generate-design-tokens.mjs'
              - 'scripts/generate-design-tokens.test.mjs'
              - '.github/workflows/ci.yml'
            proto:
              - 'proto/**'
              - '.github/workflows/ci.yml'
            container_policy:
              - '.trivyignore.yaml'
              - 'infra/deployables.json'

      - name: Normalize matrices
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          JAVA_FILTER: ${{ steps.java.outputs.changes }}
          NODE_FILTER: ${{ steps.node.outputs.changes }}
          PYTHON_FILTER: ${{ steps.python.outputs.changes }}
          FRONTEND_FILTER: ${{ steps.surfaces.outputs.frontend }}
          MOBILE_FILTER: ${{ steps.surfaces.outputs.mobile }}
          PROTO_FILTER: ${{ steps.surfaces.outputs.proto }}
          CONTAINER_POLICY_FILTER: ${{ steps.surfaces.outputs.container_policy }}
        run: |
          set -euo pipefail

          all_java='["api-gateway","inventory-service","invoice-service","order-service","payment-service","product-service","recommendations-service","search-service","seller-finance-service","shipping-service","user-service","video-transcoder"]'
          all_node='["cart-service","configuration-service","messaging-service","monitoring-service-v2","notification-service"]'
          all_python='["video-moderator"]'

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            java_services="$all_java"
            node_services="$all_node"
            python_services="$all_python"
            frontend=true
            mobile=true
            proto=true
            container_policy=true
          else
            java_services="${JAVA_FILTER:-[]}"
            node_services="${NODE_FILTER:-[]}"
            python_services="${PYTHON_FILTER:-[]}"
            frontend="${FRONTEND_FILTER:-false}"
            mobile="${MOBILE_FILTER:-false}"
            proto="${PROTO_FILTER:-false}"
            container_policy="${CONTAINER_POLICY_FILTER:-false}"
            if [[ "$container_policy" == "true" ]]; then
              java_services="$all_java"
              node_services="$all_node"
              python_services="$all_python"
              frontend=true
            fi
          fi

          services="$(jq -cn \
            --argjson java "$java_services" \
            --argjson node "$node_services" \
            --argjson python "$python_services" \
            '$java + $node + $python | unique')"

          {
            echo "java_services=$java_services"
            echo "node_services=$node_services"
            echo "python_services=$python_services"
            echo "services=$services"
            echo "frontend=$frontend"
            echo "mobile=$mobile"
            echo "proto=$proto"
            echo "container_policy=$container_policy"
          } >> "$GITHUB_OUTPUT"

  repository_checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check script syntax
        shell: bash
        run: |
          set -euo pipefail
          find scripts infra/scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          find scripts infra/scripts -type f \( -name '*.mjs' -o -name '*.cjs' \) -print0 | xargs -0 -r -n1 node --check

      - name: Run repository tooling tests
        run: node --test scripts/ci_monitor.test.cjs scripts/generate-design-tokens.test.mjs

      - name: Test deployables manifest
        run: >-
          node --test
          infra/scripts/validate-deployables.test.mjs
          infra/scripts/validate-sensitive-paths.test.mjs
          infra/scripts/validate-trivy-policy.test.mjs
          infra/scripts/github-governance.test.mjs

      - name: Validate deployables manifest
        run: node infra/scripts/validate-deployables.mjs

      - name: Reject tracked sensitive paths
        run: node infra/scripts/validate-sensitive-paths.mjs

      - name: Validate vulnerability exception policy
        run: node infra/scripts/validate-trivy-policy.mjs

      - name: Validate Keycloak realm JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('infra/keycloak/vnshop-realm.json', 'utf8'))"

  deployable:
    name: Deployable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install manifest parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Verify generated desired state is current
        shell: bash
        run: |
          set -euo pipefail
          python infra/k8s/generate.py
          git diff --exit-code -- infra/k8s

      - name: Validate staging and production structure
        shell: bash
        run: |
          set -euo pipefail
          python infra/scripts/validate-k8s-release.py --environment staging --mode pull-request
          python infra/scripts/validate-k8s-release.py --environment prod --mode pull-request

      - name: Enforce immutable release state when locks exist
        shell: bash
        run: |
          set -euo pipefail
          for environment in staging prod; do
            lock="infra/release/locks/${environment}.json"
            if [[ -f "$lock" ]]; then
              python infra/scripts/validate-k8s-release.py --environment "$environment"
            fi
          done

  frontend:
    name: React application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: fe
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.0.0
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, test, and build
        run: pnpm run verify

  mobile:
    name: Flutter application
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    defaults:
      run:
        working-directory: vnshop_mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

  java_tests:
    name: Java unit tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.java_services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.java_services) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      - name: Run isolated unit tests
        run: mvn --batch-mode --no-transfer-progress test -DskipTests=false -Djacoco.skip=true "-Dtest=!*ApplicationTests,!Grpc*ServerTest,!*PactTest,!*IntegrationTest,!GrpcClientConfigTest,!CarrierModeSelectionTest" "-Dsurefire.failIfNoSpecifiedTests=false"

      - name: Run order migration and persistence integration tests
        if: matrix.service == 'order-service'
        run: mvn --batch-mode --no-transfer-progress test -Djacoco.skip=true -Dtest=OrderServiceIntegrationTest

      - name: Run seller-finance migration integration test
        if: matrix.service == 'seller-finance-service'
        run: mvn --batch-mode --no-transfer-progress verify -Djacoco.skip=true -Dtest=FinanceMigrationIntegrationTest

      - name: Run payment migration integration test
        if: matrix.service == 'payment-service'
        run: mvn --batch-mode --no-transfer-progress verify -Djacoco.skip=true -Dtest=PaymentMigrationIntegrationTest

  node_tests:
    name: Node service (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.node_services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.node_services) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Cache MongoDB test binary
        if: matrix.service == 'notification-service'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-memory-server-${{ runner.os }}-${{ hashFiles('services/notification-service/package-lock.json') }}
          restore-keys: mongodb-memory-server-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Audit existing lint debt
        continue-on-error: true
        shell: bash
        run: |
          if [[ -x node_modules/.bin/eslint ]]; then
            npx eslint "src/**/*.ts" --max-warnings=50
          fi

      - name: Test with coverage when configured
        shell: bash
        run: |
          if [[ -x node_modules/.bin/jest ]]; then
            test_args=(--runInBand --coverage "--coverageThreshold={}" --passWithNoTests)
            if [[ "${{ matrix.service }}" == "notification-service" ]]; then
              echo "::notice::notification-service currently requires --forceExit because its suite leaves an async handle open."
              test_args+=(--forceExit)
            fi
            npm test -- "${test_args[@]}"
          else
            echo "::notice::${{ matrix.service }} has no local Jest runner; unit tests are not configured."
          fi

      - name: Build
        run: npm run build

  python_tests:
    name: Python service (video-moderator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.python_services != '[]'
    defaults:
      run:
        working-directory: services/video-moderator
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/video-moderator/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile sources
        run: python -m compileall -q app

      - name: Run tests
        run: python -m pytest -q

  proto:
    name: Protobuf compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: "1.50.0"

      - name: Resolve baseline branch
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && -n "$GITHUB_BASE_REF" ]]; then
            branch="$GITHUB_BASE_REF"
          else
            branch="${{ github.event.repository.default_branch }}"
          fi
          git fetch --no-tags origin "$branch:refs/remotes/origin/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Lint protobuf contracts
        working-directory: proto
        run: buf lint

      - name: Detect breaking changes
        working-directory: proto
        run: buf breaking --against "../.git#ref=refs/remotes/origin/${{ steps.baseline.outputs.branch }},subdir=proto"

  service_container_scan:
    name: Service container scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, java_tests, node_tests, python_tests]
    if: >-
      ${{
        always() &&
        needs.changes.result == 'success' &&
        needs.changes.outputs.services != '[]' &&
        (needs.java_tests.result == 'success' || needs.java_tests.result == 'skipped') &&
        (needs.node_tests.result == 'success' || needs.node_tests.result == 'skipped') &&
        (needs.python_tests.result == 'success' || needs.python_tests.result == 'skipped')
      }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build image
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t vnshop/${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vnshop/${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: "1"
          trivyignores: .trivyignore.yaml

  frontend_container_scan:
    name: Frontend container scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, frontend]
    if: >-
      ${{
        always() &&
        needs.changes.result == 'success' &&
        needs.changes.outputs.frontend == 'true' &&
        needs.frontend.result == 'success'
      }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build image
        run: docker build -f fe/Dockerfile -t vnshop/frontend:${{ github.sha }} fe

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vnshop/frontend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: "1"
          trivyignores: .trivyignore.yaml

  secret_scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned Gitleaks
        run: bash infra/scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"

      - name: Scan checked-out content
        run: >-
          "$RUNNER_TEMP/gitleaks/gitleaks" dir .
          --redact
          --no-banner
          --report-format json
          --report-path gitleaks-current.json

      - name: Upload redacted scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-current-${{ github.sha }}
          path: gitleaks-current.json
          if-no-files-found: error
          retention-days: 14

  ci_gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - changes
      - repository_checks
      - deployable
      - frontend
      - mobile
      - java_tests
      - node_tests
      - python_tests
      - proto
      - service_container_scan
      - frontend_container_scan
      - secret_scan
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      REPOSITORY_RESULT: ${{ needs.repository_checks.result }}
      DEPLOYABLE_RESULT: ${{ needs.deployable.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      MOBILE_RESULT: ${{ needs.mobile.result }}
      JAVA_RESULT: ${{ needs.java_tests.result }}
      NODE_RESULT: ${{ needs.node_tests.result }}
      PYTHON_RESULT: ${{ needs.python_tests.result }}
      PROTO_RESULT: ${{ needs.proto.result }}
      SERVICE_CONTAINER_RESULT: ${{ needs.service_container_scan.result }}
      FRONTEND_CONTAINER_RESULT: ${{ needs.frontend_container_scan.result }}
      SECRET_SCAN_RESULT: ${{ needs.secret_scan.result }}
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          results=(
            "changes=$CHANGES_RESULT"
            "repository=$REPOSITORY_RESULT"
            "deployable=$DEPLOYABLE_RESULT"
            "frontend=$FRONTEND_RESULT"
            "mobile=$MOBILE_RESULT"
            "java=$JAVA_RESULT"
            "node=$NODE_RESULT"
            "python=$PYTHON_RESULT"
            "proto=$PROTO_RESULT"
            "service-container=$SERVICE_CONTAINER_RESULT"
            "frontend-container=$FRONTEND_CONTAINER_RESULT"
            "secret-scan=$SECRET_SCAN_RESULT"
          )

          for entry in "${results[@]}"; do
            name="${entry%%=*}"
            result="${entry#*=}"
            case "$result" in
              success|skipped)
                echo "$name: $result"
                ;;
              *)
                echo "::error title=CI job did not pass::$name finished with $result"
                failed=1
                ;;
            esac
          done

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

          echo "CI gate passed."
