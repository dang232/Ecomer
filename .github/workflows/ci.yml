name: VNShop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: 1
  MAVEN_OPTS: -Dmaven.repo.local=${{ github.workspace }}/.m2/repository
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Detect what changed ──
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.filter.outputs.java }}
      node: ${{ steps.filter.outputs.node }}
      poms: ${{ steps.filter.outputs.poms }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            java:
              - 'services/api-gateway/**'
              - 'services/user-service/**'
              - 'services/product-service/**'
              - 'services/inventory-service/**'
              - 'services/search-service/**'
              - 'services/order-service/**'
              - 'services/payment-service/**'
              - 'services/shipping-service/**'
              - '.github/workflows/ci.yml'
            node:
              - 'services/notification-service/**'
              - 'services/cart-service/**'
              - '.github/workflows/ci.yml'
            poms:
              - 'services/*/pom.xml'
              - '.github/workflows/ci.yml'
            any:
              - '**'

  # ── Java service matrix ──
  java-tests:
    name: Java test (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.java == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - user-service
          - product-service
          - inventory-service
          - search-service
          - order-service
          - payment-service
          - shipping-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Maven test (unit only)
        run: mvn --batch-mode test -DskipTests=false -Djacoco.skip=true "-Dtest=!*ApplicationTests,!ArchitectureRulesTest,!Grpc*ServerTest,!*PactTest,!*IntegrationTest,!GrpcClientConfigTest,!GrpcShippingRequestAdapterTest,!CarrierModeSelectionTest" "-Dsurefire.failIfNoSpecifiedTests=false"

  # ── Node service matrix ──
  node-tests:
    name: Node test (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 10
    if: needs.changes.outputs.node == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        service:
          - notification-service
          - cart-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install, test, build
        run: |
          npm ci
          npm test -- --coverage --passWithNoTests
          npm run build

  # ── Dependency CVE scan (Node services only) ──
  # Java dependency CVEs are already caught by the Docker image Trivy scan
  # (docker-scan job above). This job covers only Node service lockfiles
  # which aren't included in Docker scans. Scanning Java POMs via fs is
  # redundant AND triggers Maven Central 429 rate-limits on GitHub runner IPs.
  dependency-check:
    name: Dependency CVE scan (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, node-tests]
    if: always() && (needs.changes.outputs.node == 'true' || github.event_name == 'workflow_dispatch')

    steps:
      - uses: actions/checkout@v4

      - name: Trivy scan Node lockfiles
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: services/notification-service
          format: table
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: '1'

      - name: Trivy scan cart-service
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: services/cart-service
          format: table
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: '1'

  # ── Docker build + Trivy scan (parallel per service) ──
  docker-scan:
    name: Docker scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: java-tests
    if: needs.changes.outputs.java == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - user-service
          - product-service
          - inventory-service
          - search-service
          - order-service
          - payment-service
          - shipping-service

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t vnshop/${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vnshop/${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: '1'
          ignorefile: .trivyignore

  # ── Eslint check (notification service only) ──
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.node == 'true' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: services/notification-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/notification-service/package-lock.json

      - name: Install & lint
        run: |
          npm ci
          npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0

  # ── Proto breaking change detection ──
  proto-breaking:
    name: Proto Breaking Change Detection
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 'latest'
      - name: Resolve proto baseline branch
        id: proto-base
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -n "${GITHUB_BASE_REF}" ]; then
            branch="${GITHUB_BASE_REF}"
          else
            branch="${{ github.event.repository.default_branch }}"
          fi
          git fetch --no-tags origin "${branch}:refs/remotes/origin/${branch}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
      - run: cd proto && buf lint
      - run: cd proto && buf breaking --against "../.git#ref=refs/remotes/origin/${{ steps.proto-base.outputs.branch }},subdir=proto"

  # ── Coverage summary & gate ──
  coverage-gate:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: [java-tests, node-tests]
    if: always()
    steps:
      - name: Summarize
        run: |
          echo "Java services enforce 90% instruction coverage through jacoco:check during mvn verify."
          echo "Node services enforce coverage thresholds via Jest coverageThreshold."
