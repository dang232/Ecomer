name: Full-history secret scan

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full_history:
    name: Full-history Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out all history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        run: bash infra/scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"

      - name: Scan every ref
        run: >-
          "$RUNNER_TEMP/gitleaks/gitleaks" git .
          --log-opts=--all
          --redact
          --no-banner
          --report-format json
          --report-path gitleaks-history.json

      - name: Upload redacted scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-history-${{ github.run_id }}
          path: gitleaks-history.json
          if-no-files-found: error
          retention-days: 30
