name: Touched test
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-matrix:
    name: Build touched-test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      has-tests: ${{ steps.compute.outputs.has-tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build touched test matrix
        id: compute
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
           BASE="origin/${GITHUB_BASE_REF}"
           git fetch --no-tags origin "${BASE##origin/}:refs/remotes/${BASE}"
           RANGE="${BASE}...HEAD"
          else
           RANGE="HEAD~1...HEAD"
          fi
          mapfile -t TOUCHED < <(
           git diff --name-only --diff-filter=ACMR "${RANGE}" \
           | grep -E '^services/[^/]+/src/test/java/.*Test\.java$' || true
          )
          if [ "${#TOUCHED[@]}" -eq 0 ]; then
           echo "No test files changed - skipping."
           echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
           echo "has-tests=false" >> "$GITHUB_OUTPUT"
           exit 0
          fi
          ENTRIES='['
          SEP=''
          for t in "${TOUCHED[@]}"; do
           service="${t%%/src/*}"
           rel="${t#services/${service#services/}/src/test/java/}"
           fqcn="$(echo "${rel%.java}" | tr '/' '.')"
           ENTRIES="${ENTRIES}${SEP}{\"service\":\"${service}\",\"fqcn\":\"${fqcn}\"}"
           SEP=','
          done
          ENTRIES="${ENTRIES}]}"
          echo "Touched-test matrix:"
          echo "${ENTRIES}" | jq .
          echo "matrix={\"include\":${ENTRIES}}" >> "$GITHUB_OUTPUT"
          echo "has-tests=true" >> "$GITHUB_OUTPUT"
  run-tests:
    name: ${{ matrix.fqcn }}
    runs-on: ubuntu-latest
    needs: build-matrix
    if: needs.build-matrix.outputs.has-tests == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run ${{ matrix.fqcn }}
        run: |-
          mvn --batch-mode test \
          -Dtest="${{ matrix.fqcn }}" \
          -Djacoco.skip=true \
          -Dsurefire.failIfNoSpecifiedTests=false
