name: Governance audit

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch_policy:
    name: Branch-rule report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GOVERNANCE_AUDIT_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require administration-read audit token
        shell: bash
        run: test -n "$GH_TOKEN"

      - name: Validate branch governance
        shell: bash
        run: |
          set -euo pipefail
          node infra/scripts/github-governance.mjs check 2>&1 | tee branch-rule-report.txt

      - name: Upload branch-rule report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branch-rule-report-${{ github.run_id }}
          path: branch-rule-report.txt
          if-no-files-found: warn
          retention-days: 30
