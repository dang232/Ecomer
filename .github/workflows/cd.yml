name: VNShop CD

on:
  workflow_run:
    workflows: ["VNShop CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/vnshop

jobs:
  detect-changes:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Resolve comparison base
        id: comparison-base
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          BASE_SHA=$(git rev-parse "${HEAD_SHA}^1")
          echo "sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ steps.comparison-base.outputs.sha }}
          ref: ${{ github.event.workflow_run.head_sha }}
          filters: |
            api-gateway:
              - 'services/api-gateway/**'
            cart-service:
              - 'services/cart-service/**'
            configuration-service:
              - 'services/configuration-service/**'
            coupon-service:
              - 'services/coupon-service/**'
            inventory-service:
              - 'services/inventory-service/**'
            messaging-service:
              - 'services/messaging-service/**'
            monitoring-service-v2:
              - 'services/monitoring-service-v2/**'
            notification-service:
              - 'services/notification-service/**'
            order-service:
              - 'services/order-service/**'
            payment-service:
              - 'services/payment-service/**'
            product-service:
              - 'services/product-service/**'
            recommendations-service:
              - 'services/recommendations-service/**'
            search-service:
              - 'services/search-service/**'
            seller-finance-service:
              - 'services/seller-finance-service/**'
            shipping-service:
              - 'services/shipping-service/**'
            user-service:
              - 'services/user-service/**'

  build-push:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest
            type=raw,value=v{{date 'YYYY-MM-DD'}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  update-manifests:
    needs: [detect-changes, build-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update staging kustomization image tags
        run: |
          SHA_SHORT=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          SERVICES='${{ needs.detect-changes.outputs.services }}'
          MANIFEST=infra/k8s/overlays/staging/kustomization.yaml

          for SERVICE in $(echo "$SERVICES" | jq -r '.[]'); do
            BASE_IMAGE="vnshop/${SERVICE}"

            # The base workload uses vnshop/<service>; the overlay maps that
            # stable name to the GHCR image and owns the deployment tag.
            if ! grep -Fqx -- "- name: ${BASE_IMAGE}" "$MANIFEST"; then
              echo "::notice::Skipping ${SERVICE}: no staging workload mapping"
              continue
            fi

            awk -v image="$BASE_IMAGE" -v tag="sha-${SHA_SHORT}" '
              $0 == "- name: " image { in_image=1; print; next }
              in_image && $1 == "newTag:" { print "  newTag: " tag; in_image=0; next }
              { print }
            ' "$MANIFEST" > "${MANIFEST}.tmp"
            mv "${MANIFEST}.tmp" "$MANIFEST"
          done

      - name: Validate staging manifests
        run: kubectl kustomize infra/k8s/overlays/staging >/dev/null

      - name: Commit manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/overlays/staging/
          git diff --staged --quiet || git commit -m "ci: update staging image tags to sha-$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)"
          git push

  smoke-test:
    needs: [update-manifests]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Wait for rollout
        run: |
          echo "Waiting 60s for staging deployment to stabilize..."
          sleep 60

      - name: Health check gateway
        run: |
          GATEWAY_URL="${{ vars.STAGING_GATEWAY_URL || 'http://staging.vnshop.vn' }}"
          echo "Checking $GATEWAY_URL..."

          # Gateway health
          curl -sf "${GATEWAY_URL}/actuator/health" --max-time 10 || exit 1
          echo "✓ Gateway healthy"

          # Products endpoint
          curl -sf "${GATEWAY_URL}/products?size=1" --max-time 10 | jq -e '.success == true' || exit 1
          echo "✓ Products responding"

          # Search endpoint
          curl -sf "${GATEWAY_URL}/search?q=test" --max-time 10 | jq -e '.success == true' || exit 1
          echo "✓ Search responding"

          echo "All smoke tests passed ✓"

      - name: Notify on failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d '{"text":"⚠️ Staging smoke tests FAILED after deploy. Check CD workflow."}' || true
